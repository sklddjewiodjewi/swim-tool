<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Морской Навигатор Заплыва</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; display: flex; height: 100vh; background: #f0f4f8; }
        /* Слева: шапка + история; справа: карта на всю высоту. 50/50; на узком экране — друг под другом */
        #left { flex: 1 1 50%; min-width: 0; display: flex; flex-direction: column; }
        #controls { background: white; padding: 6px 10px; box-shadow: 0 3px 15px rgba(0,0,0,0.15); z-index: 1000; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
        .row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
        /* все элементы шапки одной высоты: поля, кнопки, значок прозрачности */
        :root { --ctl-h: 34px; }
        input, button, select { height: var(--ctl-h); box-sizing: border-box; padding: 0 8px; font-size: 14px; border: 2px solid #0288d1; border-radius: 8px; background: white; font-weight: bold; vertical-align: middle; }
        button { background: #0288d1; color: white; cursor: pointer; border-color: transparent; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
        button:hover { background: #01579b; }
        button.light { background: white; color: #0288d1; border: 2px solid #0288d1; }
        button.light:hover { background: #e1f5fe; }
        /* Своя всплывающая подсказка (вместо системной: эмодзи цветные, иконки переносятся) */
        #tip { position: fixed; z-index: 5000; pointer-events: none; display: none; max-width: 300px;
               background: #263238; color: #fff; padding: 6px 9px; border-radius: 8px; font-size: 13px; line-height: 1.35;
               box-shadow: 0 4px 14px rgba(0,0,0,0.35); white-space: pre-line; }
        #tip .icons { font-size: 18px; letter-spacing: 1px; word-break: break-all; white-space: normal; margin-top: 3px; }
        #tip .icons svg { width: 12px; height: 22px; vertical-align: middle; margin: 0 1px; }
        [data-fun] { cursor: help; border-bottom: 1px dotted currentColor; }
        #hint { font-size: 13px; color: #666; }
        #stats { background: #e8f5e9; border-left: 5px solid #2e7d32; padding: 5px 10px; border-radius: 6px; display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 15px; color: #1b5e20; }
        #stats b { color: #0d47a1; }
        #stats .main b { font-size: 17px; color: #1b5e20; }
        /* 📏 и 🔥: подсказка с составляющими на всём блоке (иконка + число), число подчёркнуто пунктиром */
        #stats .parts { cursor: pointer; }
        #partsPop { position: fixed; z-index: 5001; max-width: 340px; background: #263238; color: #fff; padding: 8px 28px 8px 10px; border-radius: 8px;
                    font-size: 13px; line-height: 1.4; white-space: pre-line; box-shadow: 0 4px 14px rgba(0,0,0,0.35); }
        #partsPop[hidden] { display: none; }
        #partsPop .x { position: absolute; top: 4px; right: 8px; cursor: pointer; opacity: 0.8; } #stats .parts b { border-bottom: 1px dotted currentColor; }
        #saveStatus { font-size: 12px; color: #888; margin-left: auto; align-self: center; }

        #map { flex: 1 1 50%; min-width: 0; min-height: 300px; }
        #history { flex-grow: 1; min-height: 0; overflow: auto; background: white; border-top: 3px solid #0288d1; }
        @media (max-width: 800px) {
            body { flex-direction: column; height: auto; }
            #left { height: auto; }
            #history { max-height: 45vh; }
            #map { height: 70vh; flex: none; border-top: 3px solid #0288d1; }
            #splitter { display: none; }
            #left { flex-basis: auto !important; }
        }
        /* План: серый фон строки, серый курсив — ещё не факт */
        tbody tr.plan td { background: #e0e0e0; color: #616161; font-style: italic; }
        tbody tr.plan:hover td { background: #d5d5d5; }
        tbody tr.plan.active td { background: #cfd8dc; }
        tbody tr.missed td { text-decoration: line-through; color: #9e9e9e; }
        tbody tr.missed td.del { text-decoration: none; }
        td.del span { cursor: pointer; padding: 0 3px; }
        td.del .done { color: #2e7d32; font-weight: bold; }
        td.del .copy { color: #0288d1; font-weight: bold; }
        td.pc, th.pc { text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
        tbody tr:not(.active) td { cursor: pointer; }
        /* сплиттер между левой частью и картой */
        #splitter { flex: 0 0 6px; cursor: col-resize; background: #0288d1; opacity: 0.35; }
        #splitter:hover, #splitter.drag { opacity: 1; }
        button.on { background: #0288d1; color: white; }
        #saveStatus.draft { color: #e65100; font-weight: bold; }
        #createBtn { background: #2e7d32; }
        #createBtn.plan { background: #6a1b9a; }
        /* значок прозрачности (клик — страница прозрачности) */
        /* группа погоды ближайшего окна (из «Прозрачности»): клик — страница прозрачности */
        #wxGroup { display: inline-flex; flex-wrap: wrap; gap: 4px; cursor: pointer; }
        #wxGroup .chip { border-radius: 8px; height: var(--ctl-h); box-sizing: border-box; padding: 0 8px; border: 2px solid transparent;
                         display: inline-flex; align-items: center; gap: 3px; font-size: 14px; font-weight: bold; white-space: nowrap;
                         color: #0d47a1; background: #e3f2fd; }
        #wxGroup:hover .chip { filter: brightness(1.05); }
        #clarBadge { color: #fff; background: #78909c; }
        .uv0 { background: #3E8E41 !important; color: #fff !important; } .uv1 { background: #C9A100 !important; color: #fff !important; }
        .uv2 { background: #E07B00 !important; color: #fff !important; } .uv3 { background: #C8332B !important; color: #fff !important; }
        .uv4 { background: #7B3FA0 !important; color: #fff !important; }
        #clarBadge.v0 { background: #B4513A; } #clarBadge.v1 { background: #A9813F; } #clarBadge.v2 { background: #55737A; }
        #clarBadge.v3 { background: #2E8B6F; } #clarBadge.v4 { background: #0F4C5C; }
        /* страница прозрачности поверх всего */
        #clarityPage { position: fixed; inset: 0; z-index: 7000; background: #E6F0EE; display: flex; flex-direction: column; }
        #clarityPage[hidden] { display: none; }
        #clarityPage .cbar { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: #0F4C5C; color: #fff; }
        #clarityPage .cbar button { background: #fff; color: #0F4C5C; }
        #clarityFrame { flex: 1; border: 0; width: 100%; }
        #wx-res.warn b { color: #e65100; }
        /* Шапка в режиме плана — серая, с плашкой */
        #controls.plan { background: #e0e0e0; }
        #planBanner { display: none; font-weight: bold; color: #424242; background: #bdbdbd; border-radius: 6px; padding: 3px 10px; }
        #controls.plan #planBanner { display: inline-block; }
        /* Ячейка, к которой относится подсказка */
        .tip-target { outline: 2px solid #ff9800; outline-offset: -2px; background: #fff3e0 !important; }
        #planWarn { font-size: 13px; color: #c62828; }
        #planBox { display: none; align-items: center; gap: 6px; background: #f3e5f5; border-radius: 8px; padding: 2px 8px; }
        #planBox input { border-color: #8e24aa; }
        #planDiff { font-size: 13px; color: #6a1b9a; }
        .planArrow { font-size: 40px; line-height: 40px; color: #e040fb; text-align: center; cursor: pointer;
                     text-shadow: 0 0 3px #fff, 0 0 6px #4a148c; }
        #history .bar { display: flex; gap: 6px; align-items: center; padding: 5px 8px; }
        #history .bar b { margin-right: auto; color: #01579b; }
        #history .bar button { padding: 0 8px; font-size: 13px; }

        table { border-collapse: collapse; width: 100%; font-size: 13px; }
        th, td { padding: 4px 5px; text-align: right; white-space: nowrap; border-bottom: 1px solid #e0e0e0; }
        th:first-child, td:first-child { text-align: left; }
        thead tr.cols th { background: #0288d1; color: white; position: sticky; top: 0; font-size: 15px; }
        /* строка итогов — тем же фоном, что шапка, отделена тонкой белой линией */
        thead tr.agg th { background: #0288d1; color: white; position: sticky; top: 28px; border-top: 1px solid rgba(255,255,255,0.7); }
        thead tr.agg th small { color: #b3e5fc; font-weight: normal; }
        tbody tr { cursor: pointer; }
        tbody tr:hover { background: #f1f8ff; }
        tbody tr.active { background: #fff8e1; }
        td.del { color: #c62828; text-align: center; }
        td.loc { font-size: 11px; color: #546e7a; letter-spacing: 0.5px; }
        svg.pin { vertical-align: middle; }
        .empty { padding: 10px; color: #666; font-size: 13px; }

        svg.ico { vertical-align: middle; display: inline-block; }
        #osmBtn { padding: 0 5px; } #osmBtn svg { opacity: 0.45; } #osmBtn.on svg { opacity: 1; } #osmBtn.on { background: #e1f5fe; }
        #feelVis.err { border-color: #c62828; } #feelVis.ok { border-color: #2e7d32; }
        #feelSt { font-size: 12px; color: #666; }
        .arrow { font-size: 14px; line-height: 14px; text-align: center; text-shadow: 0 0 3px #000; }
    </style>
</head>
<body>

<div id="tip"></div>
<div id="partsPop" hidden></div>

<div id="left">
<div id="controls">
    <div class="row">
        <span id="wxGroup" onclick="showClarity()">
            <span class="chip" id="clarBadge" title="Прозрачность воды на ближайшее окно — клик: подробно">👁 …</span>
            <span class="chip" id="uvChip" title="УФ-индекс">🔆 –</span>
            <span class="chip" id="airChip" title="Воздух">🌤 –</span>
            <span class="chip" id="sstChip" title="Вода">🌊 –</span>
            <span class="chip" id="tideChip" title="Прилив / отлив">🌙 –</span>
            <span class="chip" id="windChip" title="Ветер">💨 –</span>
        </span>
    </div>
    <div class="row">
        <span title="Курорт (центр карты)"><svg class="pin" viewBox="0 0 24 34" width="14" height="20" aria-hidden="true"><path d="M12 0C5.4 0 0 5.3 0 11.9 0 20.8 12 34 12 34s12-13.2 12-22.1C24 5.3 18.6 0 12 0z" fill="#E53935"/><circle cx="12" cy="12" r="4.6" fill="#fff"/></svg></span> <select id="locationSelect" onchange="onResortSelect()" title="Курорт (центр карты)"></select>
        <span id="resortFind" hidden><input id="resortQ" placeholder="Город или пляж" autocomplete="off" style="width: 170px;" oninput="findResortDebounced()" title="Поиск курорта (Open-Meteo Geocoding)">
            <button class="light" onclick="closeResortFind()" title="Отмена">✕</button><span id="resortRes"></span></span>
        <span title="Удаление от берега, м"><svg class="ico" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M1 3.5c3-2 5 2 8 0s5 2 8 0 4.5 1.5 6 .5" fill="none" stroke="#6d4c41" stroke-width="2" stroke-linecap="round"/><path d="M1 20.5c3-2 5 2 8 0s5 2 8 0 4.5 1.5 6 .5" fill="none" stroke="#0288d1" stroke-width="2" stroke-linecap="round"/><path d="M12 6.5v11M8.8 9.6 12 6.4l3.2 3.2M8.8 14.4 12 17.6l3.2-3.2" fill="none" stroke="#263238" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span> <input type="number" id="swimDepth" value="50" min="5" style="width: 60px;" oninput="onEdit()" title="Удаление от берега, м"> м
        <span title="Рысканье: надбавка к дистанции за неровный курс (ушёл вглубь, вернулся, обплыл кого-то). По умолчанию 9 % — исследование Univ. of Kent (17 пловцов, GPS): в среднем +9 % к маршруту">〽️</span> <input type="number" id="ryskPct" value="9" min="0" max="100" step="1" style="width: 55px;" oninput="onEdit()" title="Рысканье, % к дистанции"> %
        <button class="light" id="osmBtn" onclick="toggleOsm()" title="Показать исходную линию берега OSM"><svg class="ico" viewBox="0 0 22 22" width="22" height="22" aria-hidden="true"><defs><clipPath id="osmClip"><rect x="1" y="1" width="20" height="20" rx="4"/></clipPath></defs><g clip-path="url(#osmClip)"><rect x="1" y="1" width="20" height="20" fill="#4AA8F0"/><path d="M1 1h20v4c-3 1-4 4-7 4s-3 4-6 5-4 3-7 4z" fill="#ECE6DA"/><path d="M21 5c-3 1-4 4-7 4s-3 4-6 5-4 3-7 4" fill="none" stroke="#37474f" stroke-width="1.4"/></g><rect x="1" y="1" width="20" height="20" rx="4" fill="none" stroke="#90a4ae" stroke-width="0.8"/></svg></button>
        <button class="light" id="seaBtn" onclick="flipSea()" title="Сторона моря (только без данных о береге)" style="display:none">⇄ море</button>
        <button class="light" onclick="clearMap()" title="Очистить точки">🗑️</button>
        <span title="Видимость по ощущениям — уходит в замеры прозрачности на дату и окно заплыва (окно — по времени «с»)">👁</span>
        <input type="text" id="feelVis" inputmode="decimal" placeholder="м / ±" autocomplete="off" style="width: 64px;" onchange="onFeelVis()"
            title="Видимость по ощущениям, м (3) или поправка к прогнозу (+1, −0,5). Уходит в замеры прозрачности: дата — из 📅, окно — по времени «с» (до 13:00 утро, позже вечер). Пусто — замер удалить"> м <span id="feelSt"></span>
        <span id="hint"></span>
        <span id="planBanner"></span>
    </div>
    <div class="row">
        <span title="Дата заплыва (в неё идёт автосохранение)">📅</span> <input type="date" id="swimDate" onchange="onDateChange()" title="Дата заплыва (в неё идёт автосохранение). Если за эту дату есть запись — она подставится">
        <button class="light" onclick="deleteSwim(val('swimDate'))" title="Удалить запись за эту дату">✕</button>
        <button class="light" onclick="planTomorrow()" title="Перейти к плану на завтра (дистанция или ккал, стрелки покажут, куда продлить)"><svg class="ico" viewBox="0 0 26 22" width="24" height="21" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5h19v16H7"/><path d="M5 2.5a2 2 0 0 0-2 2v13.8a2 2 0 0 0 4 0V4.5a2 2 0 0 0-2-2z"/><path d="M10 14.5l3.4-3.6 2.6 2.1 3.6-4.6"/><path d="M19.6 8.4V5.2"/><path d="M19.6 5.2l2.7 1.1-2.7 1.1z" fill="currentColor"/><path d="M10 16.2h11"/></svg></button>
        <button id="createBtn" onclick="createRecord()" title="Записать: без этого черновик в историю не попадает">✅ Записать</button>
        <span id="planBox"><span title="План: целевая дистанция, км">🎯</span>
            <input type="number" id="targetKm" min="0.1" step="0.1" style="width: 65px;" oninput="planBy='km'; onEdit()" title="Целевая дистанция, км (с рысканьем)"> км
            <span title="План: целевая энергия, ккал">🔥</span>
            <input type="number" id="targetKcal" min="10" step="50" style="width: 75px;" oninput="planBy='kcal'; onEdit()" title="Целевая энергия, ккал — дистанция посчитается сама"> ккал
            <span id="planDiff"></span> <span id="planWarn"></span></span>
        <span title="Время заплыва: с … по … (местное). Длительность считается сама; ветер и течение — по часам">🕐</span>
        <input type="time" id="startTime" style="width: 95px;" oninput="onEdit()" title="Начало (местное)">
        <span title="по">–</span>
        <input type="time" id="endTime" style="width: 95px;" oninput="onEdit()" title="Конец (местное). Если не задан — ⏱ вводится вручную">
        <span title="Время заплыва, ч (дробью: 1.5 = 1 ч 30 мин)">⏱</span> <input type="number" id="timeH" value="1" min="0" max="24" step="0.05" style="width: 65px;" oninput="onEdit()" title="Время заплыва, ч (дробью)"> ч
        <span title="Вес, кг">⚖️</span> <input type="number" id="weight" value="75" min="30" max="200" style="width: 60px;" oninput="onEdit()" title="Вес, кг"> кг
        <span title="Вода">🌡</span> <select id="water" onchange="onEdit()" title="Вода">
            <option value="warm">☀️ &gt;24°</option>
            <option value="cool" selected>🌤 18–23°</option>
            <option value="cold">❄️ &lt;18°</option>
        </select>
    </div>
    <div id="stats">
        <span class="main parts" title="Дистанция, км (с рысканьем)">📏 <b id="dist-res">--</b></span>
        <span title="Скорость, км/ч">🏊 <b id="speed-res">--</b></span>
        <span class="parts" title="Энергия, ккал">🔥 <b id="calories-res">--</b></span>
        <span title="Углеводы, г">🍺 <b id="carbs-res">--</b></span>
        <span title="Жир, г">🐻 <b id="fat-loss-res">--</b></span>
        <span title="Потеря жидкости (пот/дыхание), л">💧 <b id="fluid-res">--</b></span>
        <span title="Потеря веса (жир + жидкость + гликоген), кг">📉 <b id="total-loss-res">--</b></span>
        <span id="wx-res" title="Ветер и течение: поправка цены километра">🌬 <b id="wx-val">--</b></span>
        <span id="saveStatus" title="Состояние записи за дату в 📅"></span>
    </div>
</div>

    <div id="history">
        <div class="bar">
            <b>📋 История</b>
            <button class="light" onclick="exportHistory()" title="Экспорт истории в JSON">⬇️</button>
            <button class="light" onclick="document.getElementById('importFile').click()" title="Импорт истории из JSON">⬆️</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importHistory(this)">
            <button class="light" onclick="exportDebug()" title="Скачать лог для разбора ошибок (лог + текущие значения + история)">🐞</button>
        </div>
        <div id="historyTable"></div>
    </div>
</div>

<div id="clarityPage" hidden>
    <div class="cbar"><button onclick="showSwim()" title="Вернуться к заплыву">← Заплыв</button><b>👁 Прозрачность воды</b></div>
    <iframe id="clarityFrame" title="Прозрачность воды"></iframe>

<script>
// ================= ПОДСКАЗКИ =================
// Любой title превращается в data-tip при наведении (системная подсказка не всплывает).
// data-fun — шуточная подсказка с иконками (HTML), показывается вместе с обычной.
(function initTip() {
    const tip = document.getElementById('tip');
    let cur = null;
    function textOf(el) {
        if (el.hasAttribute('title')) { el.dataset.tip = el.title; el.removeAttribute('title'); }
        return el.dataset.tip || '';
    }
    document.addEventListener('mouseover', e => {
        let el = e.target.closest && e.target.closest('[title],[data-tip],[data-fun]');
        // поднять title со всех предков, чтобы системная подсказка не вылезла поверх
        for (let a = e.target; a && a.hasAttribute; a = a.parentElement) if (a.hasAttribute('title')) textOf(a);
        if (el === cur) return;
        hide();
        if (!el) return;
        const t = textOf(el), fun = el.dataset.fun || '';
        if (!t && !fun) return;
        cur = el;
        tip.innerHTML = '';
        if (t) tip.appendChild(document.createTextNode(t));
        if (fun) { tip.insertAdjacentHTML('beforeend', fun); el.classList.add('tip-target'); } // подсветить, к чему относится
        tip.style.display = 'block';
        // сбоку от элемента (справа, если не влезает — слева), по центру его высоты: не перекрывает соседние строки
        const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
        let x = r.right + 8;
        if (x + w > innerWidth - 4) x = Math.max(4, r.left - w - 8);
        let y = Math.max(4, Math.min(innerHeight - h - 4, r.top + r.height / 2 - h / 2));
        tip.style.left = x + 'px'; tip.style.top = y + 'px';
    });
    function hide() {
        tip.style.display = 'none';
        if (cur) cur.classList.remove('tip-target');
        cur = null;
    }
    document.addEventListener('mouseout', e => { if (!e.relatedTarget) hide(); });
    document.addEventListener('scroll', hide, true);
})();

// Клик по 📏 / 🔥 — составляющие в окошке, которое не исчезает, пока не кликнуть мимо (и для телефона)
document.addEventListener('click', e => {
    const pop = $('partsPop'), el = e.target.closest && e.target.closest('#stats .parts');
    if (el) {
        const t = el.getAttribute('title') || el.dataset.tip || '';
        if (!t) return;
        pop.textContent = t; pop.insertAdjacentHTML('afterbegin', '<span class="x" title="Закрыть">✕</span>');
        pop.hidden = false; $('tip').style.display = 'none';
        const r = el.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
        pop.style.left = Math.max(4, Math.min(innerWidth - w - 4, r.left)) + 'px';
        pop.style.top = Math.max(4, Math.min(innerHeight - h - 4, r.bottom + 6)) + 'px';
        log('parts-pop', { id: el.querySelector('b') && el.querySelector('b').id, len: t.length });
        return;
    }
    if (!pop.hidden && !e.target.closest('#partsPop .x') && e.target.closest('#partsPop')) return;
    pop.hidden = true;
});

// ================= ЛОГ (для разбора ошибок) =================
// Кольцевой буфер в localStorage: последние LOG_MAX записей {t, ev, ...данные}. Кнопка 🐞 скачивает.
const STORE_LOG = 'swim.log.v1';
const LOG_MAX = 500;
let logBuf = (() => { try { return JSON.parse(localStorage.getItem(STORE_LOG)) || []; } catch (e) { return []; } })();
let logTimer = null;
function log(ev, data) {
    const t = new Date().toISOString();
    logBuf.push(Object.assign({ t, ev }, data || {}));
    if (logBuf.length > LOG_MAX) logBuf.splice(0, logBuf.length - LOG_MAX);
    clearTimeout(logTimer);
    logTimer = setTimeout(() => { try { localStorage.setItem(STORE_LOG, JSON.stringify(logBuf)); } catch (e) {} }, 300);
    try { console.debug('[swim]', ev, data || ''); } catch (e) {}
}
window.addEventListener('error', e => log('js-error', { msg: e.message, src: (e.filename || '').split('/').pop(), line: e.lineno, col: e.colno, stack: e.error && String(e.error.stack).slice(0, 800) }));
window.addEventListener('unhandledrejection', e => log('promise-error', { msg: String(e.reason && (e.reason.stack || e.reason)).slice(0, 800) }));
const r3 = x => Math.round(x * 1000) / 1000;
const llStr = p => [+p.lat.toFixed(6), +p.lng.toFixed(6)];

function exportDebug() {
    try { localStorage.setItem(STORE_LOG, JSON.stringify(logBuf)); } catch (e) {}
    const dump = {
        exportedAt: new Date().toISOString(), userAgent: navigator.userAgent,
        state: lsGet(STORE_STATE, null),
        runtime: { date: val('swimDate'), isPlan: isPlan(), targetKm: num('targetKm'), distanceKm: currentDistanceKm,
                   baseKm: baseDistanceKm, rysk: num('ryskPct'), depth: num('swimDepth'), hasRecord: !!currentRec(),
                   trackModel, coastState, legs: trackLegs.map(l => ({ dir: l.dir, n: l.pts.length })),
                   points: points.map(p => [p.lat, p.lng]) },
        coast: coast ? { bbox: coast.bbox, chains: coast.chains.length, pts: coast.chains.reduce((a, c) => a + c.length, 0),
                         usedChain: lastCoastStats, corridor_m: CORRIDOR_M,
                         raw: coast.chains.map(c => c.map(q => [+q[0].toFixed(6), +q[1].toFixed(6)])) } : null,
        history: getHistory(),
        log: logBuf
    };
    const blob = new Blob([JSON.stringify(dump, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `swim_debug_${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    log('debug-export', { entries: logBuf.length });
}

// ================= ХРАНЕНИЕ =================
const STORE_STATE = 'swim.state.v1';    // последние значения + маршрут
const STORE_HIST  = 'swim.history.v1';  // записи истории
const STORE_COAST = 'swim.coast.v1';    // кэш береговой линии OSM

function lsGet(key, def) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function lsSet(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
const $ = id => document.getElementById(id);
const val = id => $(id).value;
const num = id => parseFloat($(id).value) || 0;

let restoring = false;
let planBy = 'km';      // план задан по 'km' или по 'kcal' — второе поле считается
let splitPx = null;     // ширина левой части (сплиттер), null — 50/50
let showOsm = false;    // показывать исходную линию берега OSM
let ignoreDblUntil = 0; // после клика по стрелке/точке двойной клик по карте не ставит точку
const DEFAULT_RYSK = 9; // %, Univ. of Kent: пловцы в среднем проплывают на 9 % больше маршрута
let seaSide = 1; // только для запасной модели без берега: +1 море справа по ходу, -1 слева

function saveState() {
    if (restoring) return;
    lsSet(STORE_STATE, {
        location: val('locationSelect'), depth: num('swimDepth'), rysk: num('ryskPct'), timeH: num('timeH'),
        weight: num('weight'), water: val('water'), seaSide, points: points.map(p => [p.lat, p.lng]),
        targetKm: num('targetKm'), targetKcal: num('targetKcal'), planBy,
        split: splitPx, showOsm, startTime: val('startTime'), endTime: val('endTime'),
        view: { c: [map.getCenter().lat, map.getCenter().lng], z: map.getZoom() } // масштаб и положение карты
    });
}

// ================= КАРТА =================
// Курорты: встроенные + свои (поиск Open-Meteo Geocoding, хранятся в swim.resorts.v1).
// short — 3 буквы для истории (эмодзи-флаги Windows не рисует — показывал «VN»).
const STORE_RESORTS = 'swim.resorts.v1';
const BUILTIN_RESORTS = [
    { id: 'nhatrang', name: 'Нячанг', short: 'НЯЧ', lat: 12.242, lng: 109.196 },
    { id: 'phuquoc', name: 'Фукуок, Зыонг Донг', short: 'ФУК', lat: 10.217, lng: 103.958 },
    { id: 'phuket', name: 'Пхукет', short: 'ПХУ', lat: 7.884, lng: 98.293 },
    { id: 'sochi', name: 'Сочи', short: 'СОЧ', lat: 43.573, lng: 39.726 },
    { id: 'dubai', name: 'Дубай', short: 'ДУБ', lat: 25.141, lng: 55.185 }
];
let customResorts = lsGet(STORE_RESORTS, []);
const allResorts = () => [...BUILTIN_RESORTS, ...customResorts];
const resortById = id => allResorts().find(r => r.id === id);

let undoStack = [];
function pushUndo() {
    if (typeof planWarnText !== 'undefined') planWarnText = '';
    undoStack.push(points.map(p => [p.lat, p.lng]));
    if (undoStack.length > 100) undoStack.shift();
}
function undo() {
    if (!undoStack.length) return;
    const u = undoStack.pop();
    if (Array.isArray(u)) setRoute(u, false);
    else { skipUndoPush = true; applyRecord(u, false, true); skipUndoPush = false; } // откат копирования ⧉ — вся форма
    onEdit();
}
let skipUndoPush = false;
document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return; // в полях — обычный Ctrl+Z
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'z' || e.key === 'я' || e.code === 'KeyZ')) {

// ---------- Точки ----------
function addPoint(coords) {
    const idx = points.length;
    const isStart = idx === 0;
    const marker = L.marker(coords, { icon: isStart ? iconStart : iconRef, draggable: true }).addTo(map)
        .bindTooltip(isStart ? '🟢 старт / выход' : `🔴 ориентир ${idx}`, { direction: 'top', offset: [0, -8] });
    markers.push(marker);
    points.push(coords);
    marker.on('dragstart', pushUndo);
    marker.on('drag', () => { points[idx] = marker.getLatLng(); scheduleRoute(); });
    marker.on('dragend', () => { if (!mergeAfterDrag(idx)) onEdit(); });
    marker.on('click', () => { ignoreDblUntil = Date.now() + 600; if (planExtremes().some(e => e.idx === idx)) adjustToTarget(idx); });
    marker.on('contextmenu', () => { // правый клик — удалить точку
        pushUndo();
        const pts = points.map(p => [p.lat, p.lng]);
        pts.splice(idx, 1);
        setRoute(pts, false);
        onEdit();
    });
}

// Слияние: точки ближе MERGE_PX пикселей считаются одной
const MERGE_PX = 15;
function nearPointIdx(ll, except) {
    const a = map.latLngToContainerPoint(ll);
    for (let i = 0; i < points.length; i++) {
        if (i === except) continue;
        const b = map.latLngToContainerPoint(points[i]);
        if (Math.hypot(a.x - b.x, a.y - b.y) < MERGE_PX) return i;
    }
    return -1;
}
// После перетаскивания: если легла на другую точку — одну убрать (старт всегда остаётся)
function mergeAfterDrag(idx) {
    const j = nearPointIdx(points[idx], idx);
    if (j < 0) return false;
    const pts = points.map(p => [p.lat, p.lng]);
    const drop = idx === 0 ? j : (j === 0 ? idx : idx); // старт приоритетнее, иначе убираем перетащенную
    pts.splice(drop, 1);
    log('merge', { dragged: idx, onto: j, dropped: drop });
    setRoute(pts, false);
    onEdit();
    return true;
}

map.on('dblclick', e => {

// ================= БЕРЕГ ИЗ OSM =================
// natural=coastline: по соглашению OSM вода всегда СПРАВА по направлению линии.
const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
const COAST_PAD_DEG = 0.03;  // запас вокруг точек при запросе (~3 км)
let coast = lsGet(STORE_COAST, null); // {bbox:[s,w,n,e], chains:[[[lat,lng],...],...]}
let coastState = 'idle';              // idle | loading | ok | fail
let coastFailBox = null;              // bbox, для которого запрос не удался (не долбим повторно)

const COAST_EDGE_DEG = 0.01; // ~1 км: точка ближе к краю загруженного берега — догрузить заранее
function boxCovers(b, pts, inset = 0) {
    return b && pts.every(p => p.lat > b[0] + inset && p.lat < b[2] - inset && p.lng > b[1] + inset && p.lng < b[3] - inset);
}

// Склеить куски береговой линии в непрерывные цепочки
function stitchWays(ways) {
    const key = p => p[0].toFixed(7) + ',' + p[1].toFixed(7);
    let chains = ways.map(w => w.slice());
    let merged = true;
    while (merged) {
        merged = false;
        const byStart = new Map();
        chains.forEach((c, i) => byStart.set(key(c[0]), i));
        for (let i = 0; i < chains.length; i++) {
            if (!chains[i]) continue;
            const j = byStart.get(key(chains[i][chains[i].length - 1]));
            if (j != null && j !== i && chains[j]) {
                chains[i] = chains[i].concat(chains[j].slice(1));
                chains[j] = null;
                merged = true;
            }
        }
        chains = chains.filter(Boolean);
    }
    return chains;
}

async function ensureCoast() {
    if (points.length < 2 || coastState === 'loading') return;
    // с запасом от края: у края данные берега обрываются, точка «упрётся» в конец линии
    if (boxCovers(coast && coast.bbox, points, COAST_EDGE_DEG)) { coastState = 'ok'; return; }
    if (boxCovers(coastFailBox, points)) return;
    const lats = points.map(p => p.lat), lngs = points.map(p => p.lng);
    const bbox = [Math.min(...lats) - COAST_PAD_DEG, Math.min(...lngs) - COAST_PAD_DEG,
                  Math.max(...lats) + COAST_PAD_DEG, Math.max(...lngs) + COAST_PAD_DEG];
    const q = `[out:json][timeout:25];way["natural"="coastline"](${bbox.map(v => v.toFixed(5)).join(',')});out geom;`;
    coastState = 'loading';
    log('coast-request', { bbox: bbox.map(v => +v.toFixed(4)) });
    updateHint();
    for (const url of OVERPASS) {
        try {
            const resp = await fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(q),
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
            if (!resp.ok) { log('coast-http', { url, status: resp.status }); continue; }
            const js = await resp.json();
            const ways = (js.elements || []).filter(e => e.geometry).map(e => e.geometry.map(g => [g.lat, g.lon]));
            if (!ways.length) { log('coast-empty', { url }); break; } // берега в этой области нет
            coast = { bbox, chains: stitchWays(ways) };
            lsSet(STORE_COAST, coast);
            coastState = 'ok';
            log('coast-ok', { url, ways: ways.length, chains: coast.chains.length });
            drawOsm();
            const before = currentDistanceKm;
            updateSwimRoute();
            log('track-rebuilt', { reason: 'coast-loaded', km_before: r3(before), km: r3(currentDistanceKm) });
            if (pendingAdjust != null) { const i = pendingAdjust; pendingAdjust = null; adjustToTarget(i, true); }
            return;
        } catch (e) { log('coast-fetch-error', { url, msg: String(e).slice(0, 200) }); }
    }
    coastState = 'fail';
    coastFailBox = bbox;
    pendingAdjust = null;
    log('coast-fail', {});
    updateSwimRoute();
}

// ================= ГЕОМЕТРИЯ =================
// Локальные метры вокруг опорной точки (для пары десятков км точности хватает)
function makeProj(o) {
    const KX = 111320 * Math.cos(o.lat * Math.PI / 180), KY = 110540;
    return {
        xy: ll => ({ x: (ll.lng - o.lng) * KX, y: (ll.lat - o.lat) * KY }),
        ll: p => L.latLng(o.lat + p.y / KY, o.lng + p.x / KX)
    };
}
const dist = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);

// ---------- Модель «коридор» ----------
// Пловец держится на удалении 🌊 от берега с небольшим допуском ±CORRIDOR_M/2 и внутри этого
// коридора плывёт максимально прямо: жадно берёт самые длинные хорды, которые целиком в коридоре
// и не пересекают берег. Шире коридор ⇒ хорды длиннее ⇒ путь короче (монотонно по построению).
// Допуск фиксированный — он гасит шум данных берега; реальный неровный курс учитывает 〽️ рысканье.
let CORRIDOR_M = 30;       // ширина коридора, м (не параметр интерфейса)
const SHORE_STEP = 5;      // шаг перевыборки берега, м
const CHECK_STEP = 15;     // шаг проверки хорды, м
const ENTRY_SLOPE = 3;     // вход/выход по косой: 1 м от берега на 3 м пути
const GRID_C = 50;         // ячейка сетки поиска, м
const MAX_COAST_DIST = 1500; // старт дальше от берега OSM — берег не тот, запасная модель
const HI_CHECK_MAX = 2000;   // при коридоре шире этого верхнюю границу не проверяем (только для тестов крайних значений)

// Берег: узлы OSM как есть, параметр s (м вдоль берега), сетка отрезков для быстрых запросов
function makeShore(xy) {
    const pts = xy.filter((p, i) => i === 0 || dist(p, xy[i - 1]) > 0.01), s = [];
    s.push(0);
    for (let i = 1; i < pts.length; i++) s.push(s[i - 1] + dist(pts[i - 1], pts[i]));
    const grid = new Map(), key = (i, j) => i * 100003 + j;
    for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        for (let x = Math.floor(Math.min(a.x, b.x) / GRID_C); x <= Math.floor(Math.max(a.x, b.x) / GRID_C); x++)
            for (let y = Math.floor(Math.min(a.y, b.y) / GRID_C); y <= Math.floor(Math.max(a.y, b.y) / GRID_C); y++) {
                const k = key(x, y); if (!grid.has(k)) grid.set(k, []); grid.get(k).push(i);
            }
    }
    // Ближайшая точка берега в радиусе R: d со знаком (+ вода справа по ходу coastline, − суша), s, foot
    function near(p, R) {
        const r = Math.ceil(R / GRID_C), ci = Math.floor(p.x / GRID_C), cj = Math.floor(p.y / GRID_C);
        let best = null;
        for (let x = ci - r; x <= ci + r; x++) for (let y = cj - r; y <= cj + r; y++) {
            const Lst = grid.get(key(x, y)); if (!Lst) continue;
            for (const i of Lst) {
                const a = pts[i], b = pts[i + 1], dx = b.x - a.x, dy = b.y - a.y, L2 = dx * dx + dy * dy || 1;
                const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / L2));
                const qx = a.x + t * dx, qy = a.y + t * dy, d = Math.hypot(p.x - qx, p.y - qy);
                if (!best || d < best.d) best = { d, i, t, foot: { x: qx, y: qy },
                    sign: (dx * (p.y - a.y) - dy * (p.x - a.x)) < 0 ? 1 : -1 };
            }
        }
        if (!best || best.d > R) return null;
        return { d: best.d * best.sign, s: s[best.i] + best.t * (s[best.i + 1] - s[best.i]), foot: best.foot, i: best.i };
    }
    // Пересекает ли отрезок pq линию берега
    function crosses(p, q) {
        const seen = new Set();
        for (let x = Math.floor(Math.min(p.x, q.x) / GRID_C); x <= Math.floor(Math.max(p.x, q.x) / GRID_C); x++)
            for (let y = Math.floor(Math.min(p.y, q.y) / GRID_C); y <= Math.floor(Math.max(p.y, q.y) / GRID_C); y++) {
                const Lst = grid.get(key(x, y)); if (!Lst) continue;
                for (const i of Lst) {
                    if (seen.has(i)) continue; seen.add(i);
                    const a = pts[i], b = pts[i + 1];
                    const d1 = (q.x - p.x) * (a.y - p.y) - (q.y - p.y) * (a.x - p.x), d2 = (q.x - p.x) * (b.y - p.y) - (q.y - p.y) * (b.x - p.x);
                    const d3 = (b.x - a.x) * (p.y - a.y) - (b.y - a.y) * (p.x - a.x), d4 = (b.x - a.x) * (q.y - a.y) - (b.y - a.y) * (q.x - a.x);
                    if (d1 * d2 < 0 && d3 * d4 < 0) return true;
                }
            }
        return false;
    }
    // Точка берега по параметру s
    function at(sv) {
        sv = Math.max(0, Math.min(s[s.length - 1], sv));
        let lo = 0, hi = s.length - 1;
        while (hi - lo > 1) { const m = (lo + hi) >> 1; if (s[m] <= sv) lo = m; else hi = m; }
        const t = (sv - s[lo]) / ((s[hi] - s[lo]) || 1);
        return { x: pts[lo].x + t * (pts[hi].x - pts[lo].x), y: pts[lo].y + t * (pts[hi].y - pts[lo].y), i: lo };
    }
    // Нормаль в сторону воды в точке s (сглажена по ±10 м)
    function normalAt(sv) {
        const a = at(sv - 10), b = at(sv + 10), dx = b.x - a.x, dy = b.y - a.y, Ln = Math.hypot(dx, dy) || 1;
        return { x: dy / Ln, y: -dx / Ln };
    }
    return { pts, s, near, crosses, at, normalAt, len: s[s.length - 1] };
}

// Осевая линия коридора: сдвиг берега на d в воду; точки, оказавшиеся ближе d к берегу
// (петли на внутренних углах), выкидываются. У каждой точки — s берега, от которой она построена.
function centerline(sh, d) {
    const out = [];
    for (let sv = 0; sv <= sh.len; sv += SHORE_STEP) {
        const p = sh.at(sv), n = sh.normalAt(sv);
        const q = { x: p.x + n.x * d, y: p.y + n.y * d, s: sv };
        const nr = sh.near(q, d + 30);
        if (nr && nr.d >= d * 0.97) out.push(q);
    }
    return out;
}
function clIndex(cl, sv) { // ближайший по s индекс осевой
    let lo = 0, hi = cl.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cl[m].s <= sv) lo = m; else hi = m; }
    return Math.abs(cl[hi].s - sv) < Math.abs(cl[lo].s - sv) ? hi : lo;
}

// Точка разворота → точка осевой. У выпуклого угла (край набережной, пирс) несколько точек осевой проецируются
// на берег в одно место — в угол; выбор «ближайшей по s» уводил разворот за угол. Поэтому: среди точек осевой
// в пределах ±3 удалений по s — ближайшая к поставленной точке ПО РАССТОЯНИЮ; почти равные (±0.5 м) —
// та, что ближе к старту по s (разворот как только ориентир на траверзе, не дальше).
function clIndexNear(cl, sv, p, d, sStart) {
    const W = Math.max(3 * d, 60);
    let lo = clIndex(cl, sv - W), hi = clIndex(cl, sv + W);
    if (lo > hi) [lo, hi] = [hi, lo];
    let best = Infinity;
    for (let i = lo; i <= hi; i++) best = Math.min(best, Math.hypot(cl[i].x - p.x, cl[i].y - p.y));
    let pick = clIndex(cl, sv), pd = Infinity;
    for (let i = lo; i <= hi; i++) {
        const dd = Math.hypot(cl[i].x - p.x, cl[i].y - p.y);
        if (dd > best + 0.5) continue;
        const ds = Math.abs(cl[i].s - sStart);
        if (ds < pd) { pd = ds; pick = i; }
    }
    return pick;
}

// Жадный путь по коридору от точки startP (или cl[iA]) до cl[iB].
// fromShore: старт с кромки воды — нижняя граница коридора растёт по косой (вход в воду).
const pathCache = new Map();
function corridorPathCached(sh, cl, iA, iB, d, startP) {
    const key = [CORRIDOR_M, d, iA, iB, startP ? Math.round(startP.x * 10) + ',' + Math.round(startP.y * 10) : ''].join('|');
    if (pathCache.has(key)) return pathCache.get(key).slice();
    const p = corridorPath(sh, cl, iA, iB, d, startP);
    if (pathCache.size > 400) pathCache.clear();
    pathCache.set(key, p);
    return p.slice();
}
function corridorPath(sh, cl, iA, iB, d, startP) {
    const lo = Math.max(0, d - CORRIDOR_M / 2), hi = d + CORRIDOR_M / 2, dir = Math.sign(iB - iA) || 1;
    const ok = (p, q, fromShore) => {
        if (sh.crosses(p, q)) return false;
        const Lpq = dist(p, q), n = Math.ceil(Lpq / CHECK_STEP);
        for (let k = 1; k < n; k++) {
            const t = k / n, x = { x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t };
            const need = fromShore ? Math.min(lo, Lpq * t / ENTRY_SLOPE) : lo;
            if (hi <= HI_CHECK_MAX) {                 // узкий коридор: берег должен быть в пределах [need, hi]
                const nr = sh.near(x, hi + 10);
                if (!nr || nr.d < need || nr.d > hi) return false;
            } else {                                  // очень широкий: проверяем только «не ближе need»
                const nr = sh.near(x, need + 10);     // (хорда не пересекает берег ⇒ вся в воде)
                if (nr && nr.d < need) return false;
            }
        }
        return true;
    };
    const path = [startP || cl[iA]];
    let cur = iA, curP = path[0], fromShore = !!startP;
    while (cur !== iB) {
        let best = cur + dir, a = 1, b = Math.abs(iB - cur);
        while (a <= b) { // самая дальняя видимая точка осевой (бинарный поиск)
            const m = (a + b) >> 1, j = cur + dir * m;
            if (ok(curP, cl[j], fromShore)) { best = j; a = m + 1; } else b = m - 1;
        }
        cur = best; curP = cl[cur]; path.push(curP); fromShore = false;
    }
    return path;
}

// Кэш: берег и осевая строятся один раз на (берег OSM, удаление)
let corrCache = null;
function getCorr(depth) {
    if (corrCache && corrCache.coastRef === coast && corrCache.depth === depth) return corrCache;
    const b = coast.bbox, P = makeProj({ lat: (b[0] + b[2]) / 2, lng: (b[1] + b[3]) / 2 });
    const t0 = Date.now();
    const chains = coast.chains.map(ch => {
        if (ch.length < 2) return null;
        const sh = makeShore(ch.map(q => P.xy({ lat: q[0], lng: q[1] })));
        return { sh, cl: centerline(sh, depth), nodes: ch.length };
    });
    corrCache = { coastRef: coast, depth, P, chains };
    pathCache.clear();
    log('corridor-prep', { depth, chains: chains.filter(Boolean).length, ms: Date.now() - t0 });
    return corrCache;
}

let lastCoastStats = null; // для лога: узлы OSM и средний шаг на используемой цепочке

// Трек по берегу: старт → развороты по порядку → старт, каждый участок — путь по коридору.
function buildCoastTrack(depth) {
    if (!coast || !coast.chains.length) return null;
    const C = getCorr(depth), P = C.P;
    const xy = points.map(P.xy);
    // цепочка берега, ближайшая к старту
    let ch = null, best = Infinity;
    C.chains.forEach((c, k) => { if (!c || c.cl.length < 2) return;
        const nr = c.sh.near(xy[0], MAX_COAST_DIST); if (nr && Math.abs(nr.d) < best) { best = Math.abs(nr.d); ch = { ...c, k }; } });
    if (!ch) return null;
    const sh = ch.sh, cl = ch.cl;
    // проекции точек на берег (s), точка старта — на кромке воды
    const pr = xy.map(p => sh.near(p, 5000));
    if (pr.some(v => !v)) return null;
    const sArr = pr.map(v => v.s);
    const n0 = sh.normalAt(sArr[0]);
    const startShore = { x: pr[0].foot.x + n0.x * 0.5, y: pr[0].foot.y + n0.y * 0.5 };
    const idx = sArr.map((sv, i) => i === 0 ? clIndex(cl, sv) : clIndexNear(cl, sv, xy[i], depth, sArr[0]));
    const seq = [0, ...points.map((_, i) => i).slice(1), 0];
    const legs = [];
    for (let k = 0; k < seq.length - 1; k++) {
        const A = seq[k], B = seq[k + 1];
        if (idx[A] === idx[B]) continue;
        const dir = Math.sign(sArr[B] - sArr[A]) || 1;
        let path;
        if (A === 0) path = corridorPathCached(sh, cl, idx[0], idx[B], depth, startShore);          // вход с берега
        else if (B === 0) path = corridorPathCached(sh, cl, idx[0], idx[A], depth, startShore).reverse(); // выход на берег
        else path = corridorPathCached(sh, cl, idx[A], idx[B], depth, null);
        legs.push({ pts: path.map(P.ll), dir });
    }
    if (!legs.length) return null;
    lastGeom = { kind: 'coast', sh, P, s: sArr };
    lastCoastStats = { chain: ch.k, nodes: ch.nodes, avgNodeStep_m: Math.round(sh.len / Math.max(1, ch.nodes - 1)) };
    return { legs, seaRight: 1 };
}

// ---------- Запасная модель (нет данных о береге): прямые ----------
// Ось берега = от старта к самой дальней точке; все точки сдвигаются в море на удаление.
function buildLineTrack(depth) {
    const P = makeProj(points[0]);
    const xy = points.map(P.xy);
    const far = xy.reduce((f, p) => dist(xy[0], p) > dist(xy[0], f) ? p : f, xy[1]);
    const L0 = dist(xy[0], far) || 1;
    const u = { x: (far.x - xy[0].x) / L0, y: (far.y - xy[0].y) / L0 };
    const nrm = { x: u.y * seaSide, y: -u.x * seaSide }; // seaSide=+1 — море справа от оси
    const off = p => ({ x: p.x + nrm.x * depth, y: p.y + nrm.y * depth });
    const seq = [xy[0], ...xy.slice(1), xy[0]];
    const legs = [];
    for (let k = 0; k < seq.length - 1; k++) {
        const A = seq[k], B = seq[k + 1];
        const dir = Math.sign((B.x - A.x) * u.x + (B.y - A.y) * u.y) || 1;
        let pts = [off(A), off(B)];
        if (k === 0) pts.unshift(A);
        if (k === seq.length - 2) pts.push(B);
        legs.push({ pts: pts.map(P.ll), dir });
    }
    lastGeom = { kind: 'line', P, u, xy };
    return { legs, seaRight: seaSide };
}

function getDistanceMeters(p1, p2) {
    const R = 6371000;
    const dLat = (p2.lat - p1.lat) * Math.PI / 180;
    const dLon = (p2.lng - p1.lng) * Math.PI / 180;
    const a = Math.sin(dLat/2) ** 2 +
              Math.cos(p1.lat * Math.PI / 180) * Math.cos(p2.lat * Math.PI / 180) * Math.sin(dLon/2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function updateHint() {
    let h;
    if (points.length === 0) h = '👆 двойной клик на берегу — старт';
    else if (points.length === 1) h = '👆 двойной клик по берегу — разворот (можно несколько, обход по порядку)';
    else h = [trackModel === 'line' ? '⚠️ без берега — прямые' : '',      // норма — без текста, только предупреждения
              coastState === 'loading' ? '⏳ берег…' : ''].filter(Boolean).join(' · ');
    $('hint').innerText = h;
    $('seaBtn').style.display = trackModel === 'line' ? '' : 'none';
}

function updateSwimRoute() {
    arrowLayer.clearLayers();
    if (points.length < 2) {
        lineLayer.clearLayers(); planLayer.clearLayers();
        trackLegs = []; trackModel = 'none'; lastGeom = null;
        currentDistanceKm = 0; baseDistanceKm = 0;
        updateHint(); drawPlan(); calculate();
        return;
    }
    ensureCoast(); // асинхронно; по готовности сам вызовет пересчёт
    ensureWx();    // погода по часам — тоже асинхронно

    const depth = num('swimDepth') || 50;
    let t = null;
    lastGeom = null;
    // старый кусок берега используем, пока новый грузится (если точки ещё внутри него)
    if (coastState !== 'fail' && boxCovers(coast && coast.bbox, points)) t = buildCoastTrack(depth);
    trackModel = t ? 'coast' : 'line';
    if (!t) t = buildLineTrack(depth);
    trackLegs = t.legs; trackSeaRight = t.seaRight;

    let total = 0;
    for (const leg of trackLegs)
        for (let i = 0; i < leg.pts.length - 1; i++) total += getDistanceMeters(leg.pts[i], leg.pts[i + 1]);
    baseDistanceKm = total / 1000;                                   // линия вдоль берега
    distParts = distanceParts();
    currentDistanceKm = baseDistanceKm * (1 + num('ryskPct') / 100); // + рысканье

    updateHint();
    drawTrack();
    calculate();
}

// Составляющие дистанции (для подсказки 📏). Любой новый параметр расчёта — сюда же, со своим вкладом.
let distParts = null;
function distanceParts() {
    if (points.length < 2 || !trackLegs.length) return null;
    const segLen = pts => { let L = 0; for (let i = 0; i < pts.length - 1; i++) L += getDistanceMeters(pts[i], pts[i + 1]); return L; };
    // вход/выход: от кромки до линии заплыва (уклон 1:3) в начале первого и в конце последнего участка → {L, k}
    const depth = num('swimDepth') || 50;
    function entry(pts) {
        if (pts.length < 2) return { L: 0, k: 0 };
        if (trackModel !== 'coast' || !lastGeom || !lastGeom.sh) return { L: getDistanceMeters(pts[0], pts[1]), k: 1 };
        let L = 0, i = 0;
        for (; i < pts.length - 1; i++) {
            const nr = lastGeom.sh.near(lastGeom.P.xy(pts[i + 1]), depth * 4);
            L += getDistanceMeters(pts[i], pts[i + 1]);
            if (!nr || Math.abs(nr.d) >= depth * 0.95) { i++; break; }
        }
        return { L, k: i };
    }
    const n = trackLegs.length, first = trackLegs[0].pts, last = trackLegs[n - 1].pts;
    const en = entry(first), ex = entry([...last].reverse());
    // прямые между разворотами по воде (хорда каждого участка без входа/выхода); огибание = остальное (≥ 0)
    let straight = 0;
    trackLegs.forEach((leg, j) => {
        const a = j === 0 ? Math.min(en.k, leg.pts.length - 1) : 0;
        const b = j === n - 1 ? Math.max(a, leg.pts.length - 1 - ex.k) : leg.pts.length - 1;
        straight += getDistanceMeters(leg.pts[a], leg.pts[b]);
    });
    const enter = en.L, exit = ex.L;
    const base = baseDistanceKm * 1000;
    return { straight, entry: enter + exit, bend: base - straight - enter - exit, base };
}
const ruN = (x, d) => x.toFixed(d).replace('.', ',').replace('-', '−');
const pctOf = (x, tot) => tot ? Math.round(x / tot * 100) : 0;
function partsTip(title, total, unit, d, rows, foot) {
    const sg = (v, t) => (Math.round(v * 10 ** d) < 0 ? '−' : '') + t;
    return title + '\n' + rows.map(([name, v]) => `${name}: ${sg(v, ruN(Math.abs(v), d))} ${unit} (${pctOf(v, total) < 0 ? '−' : ''}${Math.abs(pctOf(v, total))} %)`).join('\n')
        + `\n= ${ruN(total, d)} ${unit}` + (foot ? '\n' + foot : '');
}

// ---------- Отрисовка ----------
// Участки направления «−» смещены на несколько пикселей В СТОРОНУ МОРЯ, чтобы не слипались с «+» (только визуально)
const BACK_OFFSET_PX = 5;
function offsetLinePx(latlngs, px) { // px > 0 — вправо по ходу (экранные координаты)
    const pts = latlngs.map(ll => map.latLngToLayerPoint(ll));
    return pts.map((p, i) => {
        const a = pts[Math.max(i - 1, 0)], b = pts[Math.min(i + 1, pts.length - 1)];
        const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
        return map.layerPointToLatLng(L.point(p.x - dy / len * px, p.y + dx / len * px));
    });
}

function drawTrack() {
    arrowLayer.clearLayers();
    lineLayer.clearLayers();
    trackLegs.forEach(leg => {
        // для «−» море с той же стороны, что у «+», но относительно хода — с противоположной: px = seaRight·dir·5
        const pts = leg.dir < 0 ? offsetLinePx(leg.pts, trackSeaRight * leg.dir * BACK_OFFSET_PX) : leg.pts;
        const color = leg.dir > 0 ? COLOR_PLUS : COLOR_MINUS;
        L.polyline(pts, { color, weight: 4, lineJoin: 'round' }).addTo(lineLayer);
        addArrows(pts, color);
    });
    drawPlan();
}

// ================= ПЛАН =================
// Дата позже сегодня = план. Задаётся 🎯 дистанция; у крайних разворотов (по обе стороны от старта)
// толстые стрелки «куда двигать». Клик по стрелке/точке сдвигает её вдоль берега до нужной дистанции.
function tomorrowStr() { const d = new Date(); d.setDate(d.getDate() + 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
// План: у существующей записи — её флаг (в день плана план остаётся планом до «✓ выполнено»),
// у черновика — по дате (позже сегодня).
function currentRec() { const d = val('swimDate') || todayStr(); return getHistory().find(r => r.date === d); }
function isPlan() { const r = currentRec(); return r ? !!r.plan : (val('swimDate') || todayStr()) > todayStr(); }
const planActive = () => isPlan() && num('targetKm') > 0 && !!lastGeom && points.length >= 2;

// Положение точки вдоль берега: s (коорд. вдоль линии заплыва) или проекция на ось
function alongPos(i) {
    const g = lastGeom;
    if (g.kind === 'coast') return g.s[i];
    const p = g.xy[i]; return p.x * g.u.x + p.y * g.u.y;
}
// Крайние развороты: самый дальний по каждую сторону от старта
function planExtremes() {
    if (!planActive()) return [];
    const s0 = alongPos(0);
    let lo = null, hi = null;
    for (let i = 1; i < points.length; i++) {
        const r = alongPos(i) - s0;
        if (r > 0 && (!hi || r > hi.r)) hi = { idx: i, r, side: 1 };
        if (r < 0 && (!lo || r < lo.r)) lo = { idx: i, r, side: -1 };
    }
    return [hi, lo].filter(Boolean);
}
// Сдвиг точки i вдоль берега на delta метров (знак — по оси «+»), точка остаётся на берегу
function shiftAlong(i, delta) {
    const g = lastGeom;
    if (g.kind === 'line') {
        const p = g.xy[i], cur = alongPos(i), s0 = alongPos(0), side = Math.sign(cur - s0) || 1;
        let nxt = cur + delta;
        if (side * (nxt - s0) < 20) nxt = s0 + side * 20; // не перескакивать через старт
        return g.P.ll({ x: p.x + g.u.x * (nxt - cur), y: p.y + g.u.y * (nxt - cur) });
    }
    const s0 = g.s[0], side = Math.sign(g.s[i] - s0) || 1;
    let sv = g.s[i] + delta;
    if (side * (sv - s0) < 20) sv = s0 + side * 20;        // не перескакивать через старт
    return g.P.ll(g.sh.at(sv));                            // точка остаётся на берегу
}

// Подбор положения точки idx под 🎯: шаг = Δ/2 (туда и обратно), с затуханием, если не сходится.
// Если точка ушла за загруженный берег — ждём догрузку и продолжаем сами (pendingAdjust).
let pendingAdjust = null;
let planWarnText = '';
const ADJ_TOL_M = 5, ADJ_WARN_M = 20, ADJ_ITERS = 15;
function adjustToTarget(idx, resumed) {
    if (!planActive()) { log('adjust-skip', { idx, reason: 'plan not active' }); return; }
    if (!resumed) pushUndo();
    const target = num('targetKm') * 1000;
    log('adjust-start', { idx, resumed: !!resumed, target_m: target, dist_m: Math.round(currentDistanceKm * 1000),
                          model: trackModel, pt: llStr(points[idx]) });
    let factor = 1, prevAbs = Infinity, diff = 0;
    for (let k = 0; k < ADJ_ITERS; k++) {
        diff = target - currentDistanceKm * 1000;
        if (Math.abs(diff) < ADJ_TOL_M || !lastGeom) break;
        if (Math.abs(diff) >= prevAbs) factor *= 0.5;      // не сходится — уменьшаем шаг
        prevAbs = Math.abs(diff);
        const side = Math.sign(alongPos(idx) - alongPos(0)) || 1; // наружу от старта = продлить
        // разворот: туда и обратно ⇒ ×2; рысканье растягивает дистанцию ⇒ ÷(1+〽️)
        const step = side * diff / 2 / (1 + num('ryskPct') / 100) * factor;
        const ll = shiftAlong(idx, step);
        ignoreDblUntil = Date.now() + 600;
        points[idx] = ll;
        markers[idx].setLatLng(ll);
        updateSwimRoute();
        log('adjust-iter', { k, diff_m: Math.round(diff), step_m: Math.round(step), factor,
                             dist_m: Math.round(currentDistanceKm * 1000), model: trackModel, coast: coastState });
        if (coastState === 'loading') {                      // догрузка берега — продолжим после неё
            pendingAdjust = idx;
            log('adjust-wait-coast', { idx });
            break;
        }
    }
    diff = target - currentDistanceKm * 1000;
    planWarnText = (pendingAdjust == null && Math.abs(diff) > ADJ_WARN_M)
        ? `⚠️ не сошлось, Δ ${diff > 0 ? '+' : ''}${(diff / 1000).toFixed(2)} км` : '';
    if (pendingAdjust == null) log('adjust-end', { idx, diff_m: Math.round(diff), ok: !planWarnText });
    onEdit();
}

function drawPlan() {
    planLayer.clearLayers();
    syncPlanTargets();
    updateRecordUI();
    $('planBox').style.display = isPlan() ? 'inline-flex' : 'none';
    $('controls').classList.toggle('plan', isPlan());
    $('planBanner').innerText = isPlan() ? `📝 ПЛАН на ${fmtDate(val('swimDate'))}` : '';
    $('planWarn').innerText = isPlan() ? (pendingAdjust != null ? '⏳ догружаю берег…' : planWarnText) : '';
    if (!isPlan()) return;
    const diffKm = num('targetKm') - currentDistanceKm;
    $('planDiff').innerText = num('targetKm') > 0 && currentDistanceKm > 0
        ? (Math.abs(diffKm) < 0.05 ? '✓' : `Δ ${diffKm > 0 ? '+' : ''}${diffKm.toFixed(1)} км`) : '';
    if (Math.abs(diffKm) < 0.02) return;
    planExtremes().forEach(e => {
        const dir = e.side * Math.sign(diffKm);            // наружу — продлить, внутрь — укоротить
        const here = points[e.idx], ahead = shiftAlong(e.idx, dir * 30);
        const a = map.latLngToLayerPoint(here), b = map.latLngToLayerPoint(ahead);
        const len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
        const ux = (b.x - a.x) / len, uy = (b.y - a.y) / len;
        const pos = map.layerPointToLatLng(L.point(a.x + ux * 34, a.y + uy * 34));
        const ang = Math.atan2(uy, ux) * 180 / Math.PI;
        L.marker(pos, { icon: L.divIcon({ className: '', iconSize: [40, 40],
            html: `<div class="planArrow" title="${diffKm > 0 ? 'Продлить' : 'Укоротить'} до ${num('targetKm')} км" style="transform:rotate(${ang}deg)">➜</div>` }) })
            .on('click', () => { ignoreDblUntil = Date.now() + 600; adjustToTarget(e.idx); }).addTo(planLayer);
    });
}

// 📝: перейти к плану на завтра. Если плана нет — черновик плана; создать — кнопкой «📝 Запланировать»
function planTomorrow() {
    const t = tomorrowStr();
    if (t === openDate) return;
    leaveDate();
    $('swimDate').value = t;
    if (!openDateIn(t)) {
        if (!(num('targetKm') > 0)) { $('targetKm').value = currentDistanceKm > 0 ? currentDistanceKm.toFixed(1) : 2; planBy = 'km'; }
        updateSwimRoute();
    }
}

// План по ккал ↔ по км. В плане скорость = средняя из истории ⇒ MET постоянный ⇒ ккал ∝ км.
function kcalPerKm() {
    if (lastWx && lastWx.kcalPerKm > 0 && isPlan()) return lastWx.kcalPerKm; // с прогнозом ветра/течения
    const v = avgSpeed(), w = num('weight'), water = val('water');
    let met = metBySpeed(v);
    if (water === 'cool') met += 1.2;
    if (water === 'cold') met += 2.8;
    return (met * 3.5 * w) / 200 * 60 / v; // ккал/мин × минут на 1 км
}
function syncPlanTargets() {
    if (!isPlan() || !(num('weight') > 0)) return;
    const k = kcalPerKm();
    if (planBy === 'kcal' && num('targetKcal') > 0) {
        if (document.activeElement !== $('targetKm')) $('targetKm').value = (num('targetKcal') / k).toFixed(2);
    } else if (num('targetKm') > 0) {
        if (document.activeElement !== $('targetKcal')) $('targetKcal').value = r10(num('targetKm') * k);
    }
}

// Стрелки по ходу движения примерно каждые 120 px
function addArrows(line, color) {
    const px = line.map(ll => map.latLngToLayerPoint(ll));
    let acc = 60;
    for (let i = 0; i < px.length - 1; i++) {
        const a = px[i], b = px[i + 1], len = Math.hypot(b.x - a.x, b.y - a.y);
        if (!len) continue;
        const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
        let pos = 120 - acc;
