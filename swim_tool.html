            'Ветер и течение: 0 % — длину не меняют, влияют на время и калории'
            + (trackModel === 'line' ? '\n⚠️ без берега — прямыми' : '')));
    } else $('dist-res').parentElement.setAttribute('title', 'Дистанция, км (с рысканьем)');
    const ids = ['speed-res', 'calories-res', 'carbs-res', 'fat-loss-res', 'fluid-res', 'total-loss-res'];
    if (distance <= 0 || weight <= 0 || totalHours <= 0) {
        ids.forEach(id => $(id).innerText = '--');
        ['carbs-res', 'fat-loss-res', 'fluid-res'].forEach(id => delete $(id).dataset.fun);
        lastResult = null;
        saveState();
        return;
    }
    const totalMinutes = totalHours * 60;
    const speed = distance / totalHours;
    if (!isPlan()) wxm = windModel(totalHours);
    // нагрузка — от скорости ОТНОСИТЕЛЬНО ВОДЫ (с ветром/течением), без погоды — от скорости по берегу
    const vWork = wxm.ok ? wxm.vWaterKmh : speed;

    // Ккал по MET: MET от скорости + надбавка за воду (+1.2 прохладная, +2.8 холодная).
    // Ккал/мин = MET * 3.5 * вес / 200
    const metSpeed = metBySpeed(vWork);
    let met = metSpeed;
    if (water === 'cool') met += 1.2;
    if (water === 'cold') met += 2.8;
    const kcal = (met * 3.5 * weight) / 200 * totalMinutes;
    // Составляющие ккал (подсказка 🔥): части MET по очереди × 3.5·вес/200·минуты; сумма = итог.
    // Любой новый параметр расчёта — сюда же, со своим вкладом.
    {
        const kk = m => m * 3.5 * weight / 200 * totalMinutes;
        const vBase = baseDistanceKm / totalHours;              // по треку без рысканья, без погоды
        const rows = [['База: нагрузка по скорости ' + ruN(vBase, 1) + ' км/ч', kk(metBySpeed(vBase))],
                      ['〽️ Рысканье ' + num('ryskPct') + ' % (быстрее на ' + ruN(speed - vBase, 2) + ' км/ч)', kk(metBySpeed(speed) - metBySpeed(vBase))]];
        rows.push(['🌬 Ветер и течение' + (wxm.ok ? ' (в воде ' + ruN(vWork, 1) + ' км/ч)' : ' — не учтены'), kk(metBySpeed(vWork) - metBySpeed(speed))]);
        rows.push(['🌡 Вода ' + ({ warm: '>24°', cool: '18–23°', cold: '<18°' })[water], kk(met - metSpeed)]);
        $('calories-res').parentElement.setAttribute('title', partsTip('🔥 Энергия — из чего складывается:', kcal, 'ккал', 0, rows,
            `Множители всех частей: вес ${weight} кг × время ${ruN(totalHours, 2).replace(/,?0+$/, '')} ч (MET × 3,5 × вес / 200 × мин)`));
    }

    // Углеводы: 60 г/ч (холодная 80) при 2.4 км/ч, пропорционально нагрузке
    const carbs = totalHours * (water === 'cold' ? 80 : 60) * metSpeed / 8.5; // г
    const fatG = kcal / 7700 * 1000;                          // 1 кг жира ≈ 7700 ккал
    const fluidL = totalHours * FLUID_KG_PER_H;                     // жидкость 0.6 л/ч
    const lossKg = fatG / 1000 + fluidL + 0.3;                       // жир + жидкость + 0.3 константа (гликоген/влага)

    $('speed-res').innerText = speed.toFixed(1) + ' км/ч';
    $('calories-res').innerText = r10(kcal) + ' ккал';
    $('carbs-res').innerText = r10(carbs) + ' г';
    $('fat-loss-res').innerText = r10(fatG) + ' г';
    $('carbs-res').dataset.fun = beerTip(carbs);
    $('fat-loss-res').dataset.fun = baconTip(fatG);
    $('fluid-res').innerText = fluidL.toFixed(1) + ' л';
    $('fluid-res').dataset.fun = waterTip(fluidL);
    $('total-loss-res').innerText = lossKg.toFixed(1) + ' кг';

    // 🌬: поправка цены км относительно штиля
    const kcalCalm = (metBySpeed(speed) + (met - metSpeed)) * 3.5 * weight / 200 * totalMinutes;
    const wr = $('wx-res');
    wr.classList.toggle('warn', !wxm.ok);
    if (wxm.ok) {
        const f = kcal / kcalCalm, pct = Math.round((f - 1) * 100);
        $('wx-val').innerText = '×' + f.toFixed(2);
        wr.setAttribute('title', `Ветер ${wxm.windSpd != null ? wxm.windSpd.toFixed(1) : '—'} м/с ${compass(wxm.windFrom) ? 'с ' + compass(wxm.windFrom) : ''}`
            + (wxm.current ? `, течение ${wxm.curSpd.toFixed(2)} м/с` : ', течения нет в данных')
            + (wxm.waveMax != null ? `, волна до ${wxm.waveMax.toFixed(1)} м (не учитывается)` : '')
            + `\nСкорость в воде ${wxm.vWaterKmh.toFixed(1)} км/ч (по берегу ${speed.toFixed(1)})`
            + `\n📏 в штиль ${wxm.stillKm.toFixed(1)} км`
            + `\nЦена км ×${f.toFixed(2)}: штиль ${r10(kcalCalm)} → ${r10(kcal)} ккал (${pct >= 0 ? '+' : ''}${pct} %)`
            + `\nСнос консервативный: встречный ветер 1.3 %, попутный 2 %, мешающее течение ×0.5`);
    } else {
        $('wx-val').innerText = wxm.why ? '⚠️' : '--';
        wr.setAttribute('title', wxm.why || 'Ветер и течение: нужен трек');
    }
    lastWx = wxm.ok ? { ...wxm, kcalPerKm: kcal / distance } : null;

    lastResult = { distanceKm: +distance.toFixed(3), baseKm: +baseDistanceKm.toFixed(3), rysk: num('ryskPct'),
                   distParts: distParts ? { straight: +(distParts.straight / 1000).toFixed(3), entry: +(distParts.entry / 1000).toFixed(3),
                                            bend: +(distParts.bend / 1000).toFixed(3), depth: num('swimDepth') || 50 } : null,
                   hours: totalHours, speed, weight, water, kcal, carbs, fatG, fluidL, lossKg, model: trackModel,
                   startTime: val('startTime') || null, endTime: val('endTime') || null,
                   ...(wxm.ok ? { waterKmh: +wxm.vWaterKmh.toFixed(3), stillKm: +wxm.stillKm.toFixed(3), costF: +(kcal / kcalCalm).toFixed(4),
                                  wx: { wind: wxm.windSpd, windFrom: wxm.windFrom, cur: wxm.curSpd, wave: wxm.waveMax, windWave: wxm.windWaveMax } }
                               : { wx: null }) };
    saveState();
}

// ================= ЗАПИСИ: ЧЕРНОВИК / ЯВНОЕ СОЗДАНИЕ / АВТОСОХРАНЕНИЕ ПРАВОК =================
// Новая запись появляется ТОЛЬКО кнопкой ✅ Записать / 📝 Запланировать. Пока её нет — черновик,
// в историю ничего не пишется. Правки уже созданной записи сохраняются сами.
let saveTimer = null;
let lastSavedAt = null;
function onEdit() {
    updateSwimRoute();
    feelCheckMove();
    log('edit', { km: r3(currentDistanceKm), base_km: r3(baseDistanceKm), rysk: num('ryskPct'), depth: num('swimDepth'),
                  model: trackModel, pts: points.length, date: val('swimDate'), coast: lastCoastStats });
    clearTimeout(saveTimer);
    savePending = true;
    saveTimer = setTimeout(autoSave, 700);
}

function recordFromForm(date, plan) {
    const rs = resortById(val('locationSelect'));
    return { date, ...lastResult, location: val('locationSelect'), locName: rs ? rs.name : null, locShort: rs ? rs.short : null, depth: num('swimDepth'), seaSide,
             points: points.map(p => [p.lat, p.lng]), plan, feelVis: plan ? null : feel.actual, feelAt: plan ? null : feel.at,
             ...(plan ? { targetKm: num('targetKm'), targetKcal: num('targetKcal'), planBy } : {}) };
}

function autoSave() {
    if (coastState === 'loading') { saveTimer = setTimeout(autoSave, 1000); return; } // ждём берег
    savePending = false;
    const rec = getHistory().find(r => r.date === openDate);   // только запись открытой даты
    if (!rec) { updateRecordUI(); return; }       // черновик — не пишем
    if (!lastResult) return;                      // нет трека/времени — запись не трогаем
    const date = rec.date;
    setHistory(getHistory().filter(r => r.date !== date).concat([recordFromForm(date, !!rec.plan)]));
    lastSavedAt = new Date();
    log('autosave', { date, km: r3(lastResult.distanceKm), plan: !!rec.plan });
    updateRecordUI();
}

function createRecord() {
    const date = val('swimDate') || todayStr();
    if (currentRec()) return;
    if (!lastResult) { alert('Нет данных для записи: поставьте старт и разворот, укажите время и вес.'); return; }
    const plan = date > todayStr();
    setHistory(getHistory().concat([recordFromForm(date, plan)]));
    setDraft(date, null);
    lastSavedAt = new Date();
    log('create', { date, plan, km: r3(lastResult.distanceKm) });
    updateSwimRoute();
}

// ✓ выполнено: план → факт (открывается для правки времени и точек)
function markDone(date, ev) {
    if (ev) ev.stopPropagation();
    const h = getHistory(), r = h.find(x => x.date === date);
    if (!r) return;
    r.plan = false; delete r.targetKm; delete r.targetKcal; delete r.planBy;
    setHistory(h);
    log('plan-done', { date });
    if (date === openDate) { applyRecord(getHistory().find(x => x.date === date), true); updateSwimRoute(); renderHistory(); return; }
    leaveDate();
    $('swimDate').value = date;
    openDateIn(date);
}

function updateRecordUI() {
    const rec = currentRec(), date = val('swimDate') || todayStr();
    const btn = $('createBtn');
    btn.style.display = rec ? 'none' : '';
    btn.innerHTML = date > todayStr() ? PLAN_ICON + ' Запланировать' : '✅ Записать';
    btn.classList.toggle('plan', date > todayStr());
    const st = $('saveStatus');
    st.classList.toggle('draft', !rec);
    if (!rec) st.innerText = '✏️ черновик — не сохранено';
    else if (lastSavedAt) st.innerText = `💾 ${fmtDate(rec.date)} ${String(lastSavedAt.getHours()).padStart(2,'0')}:${String(lastSavedAt.getMinutes()).padStart(2,'0')}`;
    else st.innerText = `💾 ${fmtDate(rec.date)}`;
}

// ================= ИСТОРИЯ =================
const WATER_ICON = { warm: '☀️', cool: '🌤', cold: '❄️' };
const recHours = r => r.hours != null ? r.hours : (r.minutes || 0) / 60; // minutes — от старой версии
const fmtH = h => (+h.toFixed(2)).toString();
const fmtDate = s => {
    const [y, mo, d] = s.split('-');
    return y === String(new Date().getFullYear()) ? `${d}.${mo}` : `${d}.${mo}.${y.slice(2)}`;
};

function getHistory() { return lsGet(STORE_HIST, []); }
function setHistory(h) { h.sort((a, b) => b.date.localeCompare(a.date)); lsSet(STORE_HIST, h); renderHistory(); }

// Подставить значения записи в поля и карту (без смены даты). false — записи нет.
// asTemplate: запись берётся как шаблон для другой даты — у старых записей без 〽️ ставим 〽️ по умолчанию;
// при открытии самой записи — её 〽️ (у старых 0, чтобы дистанция не «поплыла» задним числом).
function applyRecord(rec, fit, asTemplate) {
    if (!rec) return false;
    restoring = true;
    $('locationSelect').value = rec.location || 'nhatrang';
    $('swimDepth').value = rec.depth || 50;
    $('ryskPct').value = rec.rysk != null ? rec.rysk : (asTemplate ? DEFAULT_RYSK : 0);
    $('timeH').value = fmtH(recHours(rec));
    $('weight').value = rec.weight;
    $('water').value = rec.water;
    if (rec.targetKm) $('targetKm').value = rec.targetKm;
    if (rec.targetKcal) $('targetKcal').value = rec.targetKcal;
    if (rec.planBy) planBy = rec.planBy;
    $('startTime').value = rec.startTime || (asTemplate ? val('startTime') : '');
    $('endTime').value = rec.endTime || (asTemplate ? val('endTime') : '');
    if (rec.seaSide) seaSide = rec.seaSide;
    if (!asTemplate) {  // 👁 у каждого дня свой — при копировании не переносится
        feel = { actual: rec.feelVis != null ? rec.feelVis : null, at: rec.feelAt || null };
        $('feelVis').value = feel.actual != null ? ru(feel.actual) : '';
    }
    if (!skipUndoPush) pushUndo();
    setRoute(rec.points, fit);
    restoring = false;
    updateSwimRoute();
    return true;
}

// ================= ОТКРЫТИЕ / УХОД С ДАТЫ / ЧЕРНОВИКИ / КОПИРОВАНИЕ =================
// Клик по строке = ОТКРЫТЬ запись этой даты (как смена 📅), ничего не перезаписывается.
// Копирование — только кнопкой ⧉ в строке; в существующую запись — с подтверждением (единственное место перезаписи).
// openDate — дата, чьи значения сейчас в форме: автосохранение пишет ТОЛЬКО в неё.
// Уходя с даты: есть запись и несохранённые правки — сохраняем сразу; записи нет — черновик запоминается за датой.
const STORE_DRAFTS = 'swim.drafts.v1';
let openDate = null, savePending = false;
const getDrafts = () => lsGet(STORE_DRAFTS, {});
function setDraft(date, snap) {
    const d = getDrafts(), cut = shiftDate(todayStr(), -60);
    if (snap) d[date] = snap; else delete d[date];
    Object.keys(d).forEach(k => { if (k < cut) delete d[k]; });
    lsSet(STORE_DRAFTS, d);
}
function formSnap() {
    return { location: val('locationSelect'), depth: num('swimDepth'), rysk: num('ryskPct'), hours: num('timeH'),
             weight: num('weight'), water: val('water'), startTime: val('startTime'), endTime: val('endTime'), seaSide,
             points: points.map(p => [p.lat, p.lng]), targetKm: num('targetKm'), targetKcal: num('targetKcal'), planBy };
}
function leaveDate() {
    const d = openDate; if (!d) return;
    clearTimeout(saveTimer);
    if (getHistory().some(r => r.date === d)) { if (savePending) autoSave(); }
    else if (points.length) setDraft(d, formSnap());
}
function openDateIn(date) {
    openDate = date;
    planWarnText = ''; pendingAdjust = null; lastSavedAt = null;
    const rec = getHistory().find(r => r.date === date), dr = !rec && getDrafts()[date];
    log('date-change', { date, hasRecord: !!rec, draft: !!dr });
    if (!applyRecord(rec || dr || null, true)) { feel = { actual: null, at: null }; $('feelVis').value = ''; }
    if (dr) { feel = { actual: null, at: null }; $('feelVis').value = ''; }
    updateSwimRoute();
    feelRefresh();
    renderHistory();
    return !!(rec || dr);
}
function loadSwim(date) {
    if (date === openDate) return;
    leaveDate();
    $('swimDate').value = date;
    openDateIn(date);
}
// Смена даты в 📅 — то же самое: открыть запись или черновик этой даты
function onDateChange() {
    const d = val('swimDate') || todayStr();
    if (d === openDate) return;
    leaveDate();
    openDateIn(d);
}
// ⧉ — взять маршрут и параметры записи в открытую дату (дата и 👁 не копируются). Ctrl+Z — откат.
function copyFrom(date, ev) {
    if (ev) ev.stopPropagation();
    const src = getHistory().find(r => r.date === date), cur = openDate;
    if (!src || date === cur) return;
    const exists = getHistory().some(r => r.date === cur);
    if (exists && !confirm(`Заменить запись ${fmtDate(cur)} значениями от ${fmtDate(date)}?`)) return;
    undoStack.push({ ...formSnap(), feelVis: feel.actual, feelAt: feel.at }); if (undoStack.length > 100) undoStack.shift();
    skipUndoPush = true; applyRecord(src, true, true); skipUndoPush = false;
    log('copy', { from: date, to: cur, into: exists ? 'record' : 'draft' });
    onEdit();
    renderHistory();
}

function deleteSwim(date, ev) {
    if (ev) ev.stopPropagation();
    if (!getHistory().some(r => r.date === date)) return;
    if (!confirm(`Удалить запись за ${fmtDate(date)}?`)) return;
    clearTimeout(saveTimer); savePending = false; // не пересоздать сразу автосохранением
    log('delete', { date });
    setHistory(getHistory().filter(r => r.date !== date));
    updateRecordUI();
}

// Иконка курорта: красная «перевёрнутая капля», как метка на картах (SVG — одинаково во всех браузерах)
const PLAN_ICON = '<svg class="ico" viewBox="0 0 26 22" width="24" height="21" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5h19v16H7"/><path d="M5 2.5a2 2 0 0 0-2 2v13.8a2 2 0 0 0 4 0V4.5a2 2 0 0 0-2-2z"/><path d="M10 14.5l3.4-3.6 2.6 2.1 3.6-4.6"/><path d="M19.6 8.4V5.2"/><path d="M19.6 5.2l2.7 1.1-2.7 1.1z" fill="currentColor"/><path d="M10 16.2h11"/></svg>';
const PIN_SVG = '<svg class="pin" viewBox="0 0 24 34" width="14" height="20" aria-hidden="true"><path d="M12 0C5.4 0 0 5.3 0 11.9 0 20.8 12 34 12 34s12-13.2 12-22.1C24 5.3 18.6 0 12 0z" fill="#E53935"/><circle cx="12" cy="12" r="4.6" fill="#fff"/></svg>';
const resortLabel = r => { const rs = resortById(r.location);
    return { short: (rs && rs.short) || r.locShort || (r.location || '').slice(0, 3).toUpperCase(), name: (rs && rs.name) || r.locName || r.location || '' }; };
const COLS = [ // иконка, хинт
    ['📅', 'Дата'], ['📏', 'Дистанция, км'], ['⏱', 'Время, ч'], ['🏊', 'Скорость, км/ч'], ['🌡', 'Вода'],
    ['⚖️', 'Вес, кг'], ['🔥', 'Энергия, ккал'], ['🍺', 'Углеводы, г'], ['🐻', 'Жир, г'], ['💧', 'Жидкость, л'], ['📉', 'Потеря веса, кг'], ['👁', 'Видимость по ощущениям, м'], [PIN_SVG, 'Курорт'], ['', '']
];

function renderHistory() {
    const hist = getHistory();
    const box = $('historyTable');
    if (!hist.length) {
        box.innerHTML = '<div class="empty">Пусто. Постройте трек, укажите время и нажмите «✅ Записать».</div>';
        return;
    }
    const today = todayStr();
    const done = hist.filter(r => !r.plan && r.date <= today); // агрегаты — только по фактам
    const n = Math.max(done.length, 1);
    const sum = f => done.reduce((s, r) => s + (f(r) || 0), 0);
    const totDist = sum(r => r.distanceKm), totH = sum(recHours);
    const active = openDate || val('swimDate');
    const S = 'Σ за все заплывы (без планов)', A = 'Среднее (без планов)';

    let html = `<table><thead><tr class="cols">${COLS.map(c => `<th title="${c[1]}">${c[0]}</th>`).join('')}</tr>
        <tr class="agg">
            <th title="Число заплывов (без планов)">${done.length}</th>
            <th class="pc" title="${attrTitle(partsTip('📏 Σ дистанция — из чего складывается (' + done.length + ' заплывов):', totDist, 'км', 1, sumRows(done.map(recDistRows))))}">${fmtKm(totDist)}</th>
            <th title="${S}">${fmtH(totH)}</th>
            <th title="Средняя: Σкм / Σч">${totH ? (totDist / totH).toFixed(1) : '--'}<small> ср</small></th>
            <th></th>
            <th title="${A}">${Math.round(sum(r => r.weight) / n)}<small> ср</small></th>
            <th class="pc" title="${attrTitle(partsTip('🔥 Σ энергия — из чего складывается (' + done.length + ' заплывов):', sum(r => r.kcal), 'ккал', 0, sumRows(done.map(recKcalRows))))}">${r10(sum(r => r.kcal))}</th>
            <th title="${S}" ${funAttr(beerTip(sum(r => r.carbs)))}>${r10(sum(r => r.carbs))}</th>
            <th title="${S}" ${funAttr(baconTip(sum(r => r.fatG)))}>${r10(sum(r => r.fatG))}</th>
            <th title="${S}" ${funAttr(waterTip(sum(recFluid)))}>${sum(recFluid).toFixed(1)}</th>
            <th title="${A}">${(sum(r => r.lossKg) / n).toFixed(1)}<small> ср</small></th>
            <th></th>
            <th></th>
            <th></th>
        </tr></thead><tbody>`;
    hist.forEach(r => {
        const warn = r.model === 'line' ? ' <span title="Посчитано без берега (прямыми)">⚠️</span>' : '';
        const plan = !!r.plan;
        const missed = plan && r.date < today; // план, дата прошла, «✓ выполнено» не нажато
        const cls = [r.date === active ? 'active' : '', plan ? 'plan' : '', missed ? 'missed' : ''].join(' ');
        const planMark = plan ? `<span title="${missed ? 'Пропущенный план' : 'План'}${r.targetKm ? ': 🎯 ' + r.targetKm + ' км' : ''}">📝</span> ` : '';
        const doneBtn = plan && r.date <= today
            ? `<span class="done" title="Выполнено: перевести план в факт" onclick="markDone('${r.date}', event)">✓</span>` : '';
        html += `<tr class="${cls}" onclick="loadSwim('${r.date}')">
            <td>${planMark}${fmtDate(r.date)}</td><td class="pc" title="${attrTitle(partsTip('📏 ' + fmtDate(r.date) + ' — дистанция:', +r.distanceKm, 'км', 2, recDistRows(r)))}">${fmtKm(r.distanceKm)}${warn}</td><td>${fmtH(recHours(r))}</td>
            <td>${(+r.speed).toFixed(1)}</td><td>${WATER_ICON[r.water] || ''}</td><td>${Math.round(r.weight)}</td>
            <td class="pc" title="${attrTitle(partsTip('🔥 ' + fmtDate(r.date) + ' — энергия:', +r.kcal, 'ккал', 0, recKcalRows(r), 'Вес ' + Math.round(r.weight) + ' кг × время ' + fmtH(recHours(r)) + ' ч — множители всех частей'))}">${r10(r.kcal)}</td><td ${funAttr(beerTip(r.carbs))}>${r10(r.carbs)}</td><td ${funAttr(baconTip(r.fatG))}>${r10(r.fatG)}</td><td ${funAttr(waterTip(recFluid(r)))}>${recFluid(r).toFixed(1)}</td><td>${(+r.lossKg).toFixed(1)}</td>
            <td title="${r.feelAt ? 'Видимость по ощущениям, ' + (r.feelAt.win === 'am' ? 'утро' : 'вечер') : ''}">${r.feelVis != null ? ru(r.feelVis) : ''}</td>
            <td class="loc" title="${resortLabel(r).name}">${resortLabel(r).short}</td>
            <td class="del">${doneBtn}${r.date !== active ? `<span class="copy" title="Взять маршрут и параметры этой записи в открытую дату (${fmtDate(active)}). Дата и 👁 не копируются. Ctrl+Z — откат" onclick="copyFrom('${r.date}', event)">⧉</span>` : ''}<span title="Удалить" onclick="deleteSwim('${r.date}', event)">✕</span></td></tr>`;
    });
    box.innerHTML = html + '</tbody></table>';
}

function exportHistory() {
    const blob = new Blob([JSON.stringify(getHistory(), null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `swim_history_${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
}
function importHistory(input) {
    const file = input.files[0];
    if (!file) return;
    file.text().then(t => {
        const incoming = JSON.parse(t);
        if (!Array.isArray(incoming)) throw new Error('not array');
        const byDate = {};
        getHistory().forEach(r => byDate[r.date] = r);
        incoming.forEach(r => { if (r && r.date) byDate[r.date] = r; }); // совпадение даты — берём из файла
        setHistory(Object.values(byDate));
        alert(`Импортировано: ${incoming.length}`);
    }).catch(() => alert('Не удалось прочитать файл.'));
    input.value = '';
}

// ================= ИСХОДНАЯ ЛИНИЯ БЕРЕГА OSM (вкл/выкл) =================
const osmLayer = L.layerGroup().addTo(map);
function drawOsm() {
    osmLayer.clearLayers();
    $('osmBtn').classList.toggle('on', showOsm);
    if (!showOsm || !coast) return;
    coast.chains.forEach(ch => {
        L.polyline(ch, { color: '#ffffff', weight: 1.5, opacity: 0.9, dashArray: '4 4', interactive: false }).addTo(osmLayer);
        ch.forEach(q => L.circleMarker(q, { radius: 1.5, color: '#ffeb3b', weight: 1, interactive: false }).addTo(osmLayer)); // узлы
    });
}
function toggleOsm() { showOsm = !showOsm; drawOsm(); saveState(); log('osm-toggle', { showOsm }); }

// ================= ПРОЗРАЧНОСТЬ ВОДЫ (отдельная страница, проект nhatrang-water v3.2) =================
// Страница грузится во фрейм сразу (скрыто) — обновляет свои данные и присылает прогноз на ближайшее окно.
const STORE_CLAR = 'swim.clarity.v1';
const CLAR_VERDICTS = ['Мутно', 'Так себе', 'Нормально', 'Хорошо', 'Отлично'];
const UV_NAMES = ['низкий', 'умеренный', 'высокий', 'очень высокий', 'экстремальный'];
const uvCat = u => u < 3 ? 0 : u < 6 ? 1 : u < 8 ? 2 : u < 11 ? 3 : 4;
const ru = x => String(x).replace('.', ',').replace('-', '−');
function renderClarBadge(fromCache) {
    const c = lsGet(STORE_CLAR, null), b = $('clarBadge');
    if (!c) { b.innerHTML = '👁 …'; return; }
    const vi = Math.max(0, CLAR_VERDICTS.indexOf(c.verdict));
    b.className = 'chip v' + vi;
    const t = new Date(c.at), hhmm = `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
    const when = `${c.today ? 'Сегодня' : 'Завтра'}, ${c.winName.toLowerCase()} ${c.label}`;
    const foot = `\n${when}\n${fromCache ? 'Сохранено ' + hhmm + ' — свежее подгружается' : c.src}\nКлик — страница прозрачности`;
    b.innerHTML = `👁 ${ru(c.v)} м`;
    // v3.6: альтернативы по стратегиям (★ — основная, «фон» — копят статистику)
    const alts = (c.alts || []).length ? '\n\nПо стратегиям:' + c.alts.map(a => `\n${a.prim ? '★ ' : '   '}${a.name}${a.shadow ? ' (фон)' : ''}: ${a.v != null ? ru(a.v) + ' м' : '—'}`).join('') : '';
    b.setAttribute('title', `Прозрачность воды, ${c.loc}: ${ru(c.v)} м — ${c.verdict}${c.norm ? ' (сезонная норма)' : ''} · стратегия ${c.strategy}` + alts + foot);
    const uv = $('uvChip');
    uv.className = 'chip' + (c.uv != null ? ' uv' + uvCat(c.uv) : '');
    uv.innerHTML = `🔆 ${c.uv != null ? ru(c.uv) : '–'}`;
    uv.setAttribute('title', c.uv != null ? `УФ-индекс (максимум за окно): ${ru(c.uv)} — ${UV_NAMES[uvCat(c.uv)]}` + foot : 'УФ-индекс: нет данных');
    $('airChip').innerHTML = `🌤 ${c.air != null ? c.air + '°' : '–'}`;
    $('airChip').setAttribute('title', `Воздух, средняя за окно${c.air != null ? ': ' + c.air + '°' : ': нет данных'}` + foot);
    $('sstChip').innerHTML = `🌊 ${c.sst != null ? c.sst + '°' : '–'}`;
    $('sstChip').setAttribute('title', `Вода, средняя за окно${c.sst != null ? ': ' + c.sst + '°' : ': нет данных'}` + foot);
    const td = c.tide, tc = $('tideChip');
    if (td) {
        const arrow = td.dir > 0 ? '↑' : td.dir < 0 ? '↓' : '→', d = td.delta;
        tc.innerHTML = `🌙 ${arrow} ${d > 0 ? '+' : ''}${ru(d.toFixed(1))} м`;
        tc.setAttribute('title', `${td.dir > 0 ? 'Прилив' : td.dir < 0 ? 'Отлив' : 'Уровень стоит'}: изменение уровня моря за окно ${d > 0 ? '+' : ''}${ru(d.toFixed(2))} м`
            + `\n(${ru(td.from.toFixed(2))} → ${ru(td.to.toFixed(2))} м от среднего уровня, модель)` + foot);
    } else { tc.innerHTML = '🌙 –'; tc.setAttribute('title', 'Прилив / отлив: нет данных'); }
    // ветер: м/с и стрелка «куда дует»; в подсказке км/ч, откуда, с моря/с берега
    const wc = $('windChip');
    if (c.wind != null) {
        const ms = c.wind / 3.6, ARR = ['↓', '↙', '←', '↖', '↑', '↗', '→', '↘']; // «откуда» С → дует на юг ↓
        const arr = c.windDir != null ? ARR[Math.round(c.windDir / 45) % 8] : '';
        wc.innerHTML = `💨 ${ru(ms.toFixed(0))} м/с ${arr}`;
        wc.setAttribute('title', `Ветер, средний за окно: ${ru(ms.toFixed(1))} м/с (${ru(c.wind)} км/ч)`
            + (c.windDir != null ? `, с ${compass(c.windDir)}${c.onshore ? ' — с моря' : ' — с берега'}` : '')
            + `\nСтрелка — куда дует` + foot);
    } else { wc.innerHTML = '💨 –'; wc.setAttribute('title', 'Ветер: нет данных'); }
}
window.addEventListener('message', e => {
    if (e.data && e.data.type === 'clarity-fact-ack') { onFeelAck(e.data); return; }
    if (!e.data || e.data.type !== 'clarity') return;
    if (!clarReady) { clarReady = true; clarFlush(); }
    if (window.SWIM_CLARITY_LOC && e.data.locId && e.data.locId !== window.SWIM_CLARITY_LOC.id) return; // от старого места
    lsSet(STORE_CLAR, e.data);
    renderClarBadge(false);
});
// Страница прозрачности — шаг в истории браузера: «Назад» (кнопка, жест, кнопка мыши) возвращает к заплыву, «Вперёд» — снова прозрачность.
function openClarityPage() { $('clarityPage').hidden = false; log('page', { to: 'clarity' }); }
function closeClarityPage() { if ($('clarityPage').hidden) return; $('clarityPage').hidden = true; map.invalidateSize(); log('page', { to: 'swim' }); }
function showClarity() {
    if (!$('clarityPage').hidden) return;
    try { history.pushState({ clarity: 1 }, '', location.pathname + location.search + '#clarity'); } catch (e) {}
    openClarityPage();
}
function showSwim() {
    if (history.state && history.state.clarity) history.back(); // тот же шаг, что «Назад»: лишние шаги не копятся
    else { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} closeClarityPage(); }
}
window.addEventListener('popstate', e => { if (e.state && e.state.clarity) openClarityPage(); else closeClarityPage(); });

// ================= ВИДИМОСТЬ ПО ОЩУЩЕНИЯМ → замеры прозрачности =================
// Поле 👁 пишет замер во встроенную страницу прозрачности (postMessage), без перехода на неё.
// Дата — из 📅, окно — по времени «с»: до 13:00 утро (am), позже вечер (pm); время замера — время «с».
// Источник один — журнал прозрачности: при открытии записи значение запрашивается оттуда.
let feel = { actual: null, at: null };   // at: {date, win, loc} — куда записан замер
let clarReady = false, feelSeq = 0;
const clarQueue = [], feelWait = {};
const feelWin = () => { const h = parseStart(); return h == null ? null : (h < 13 ? 'am' : 'pm'); };
const WIN_RU = { am: 'утро 05–10', pm: 'вечер 15–18' };
function clarPost(m) {
    m.loc = window.SWIM_CLARITY_LOC ? window.SWIM_CLARITY_LOC.id : null;
    if (clarReady && $('clarityFrame').contentWindow) $('clarityFrame').contentWindow.postMessage(m, '*');
    else clarQueue.push(m);
}
function clarFlush() {
    const loc = window.SWIM_CLARITY_LOC ? window.SWIM_CLARITY_LOC.id : null;
    while (clarQueue.length) { const m = clarQueue.shift(); if (m.loc === loc) $('clarityFrame').contentWindow.postMessage(m, '*'); }
}
function feelStatus(t, cls) {
    $('feelSt').innerText = t || '';
    $('feelVis').classList.remove('err', 'ok'); if (cls) $('feelVis').classList.add(cls);
}
function feelSend(date, win, value, kind) {
    const id = ++feelSeq, loc = window.SWIM_CLARITY_LOC ? window.SWIM_CLARITY_LOC.id : null;
    feelWait[id] = { date, win, loc, kind };
    clarPost({ type: kind === 'get' ? 'clarity-get-fact' : 'clarity-fact', id, date, win, value, time: val('startTime') || null });
}
function onFeelVis() {
    const date = val('swimDate') || todayStr();
    if (date > todayStr()) { feelStatus('план — замер после заплыва', 'err'); return; }
    const win = feelWin();
    if (!win) { feelStatus('⚠️ укажите время «с»', 'err'); return; }
    const v = $('feelVis').value.trim();
    const loc = window.SWIM_CLARITY_LOC ? window.SWIM_CLARITY_LOC.id : null;
    // замер был в другом окне этого же места — переносим
    if (feel.at && feel.at.loc === loc && (feel.at.date !== date || feel.at.win !== win)) feelSend(feel.at.date, feel.at.win, '', 'del');
    feelSend(date, win, v, 'set');
    feelStatus('⏳');
    log('feel', { date, win, v });
}
// время «с» поменялось и окно сменилось — замер переезжает
function feelCheckMove() {
    if (restoring || feel.actual == null || !feel.at) return;
    const date = val('swimDate') || todayStr(), win = feelWin();
    if (!win || (feel.at.date === date && feel.at.win === win)) return;
    if (feel.at.date !== date) return; // другая дата — это другая запись
    feelSend(feel.at.date, feel.at.win, '', 'del');
    feelSend(date, win, String(feel.actual), 'set');
}
// показать замер из журнала прозрачности для даты и окна заплыва
function feelRefresh() {
    const date = val('swimDate') || todayStr(), win = feelWin(), plan = date > todayStr();
    $('feelVis').disabled = plan;
    feelStatus('');
    if (plan || !win) return;
    feelSend(date, win, null, 'get');
}
function onFeelAck(d) {
    const w = feelWait[d.id]; if (!w) return; delete feelWait[d.id];
    if (w.loc && d.locId && w.loc !== d.locId) return;
    if (w.kind === 'del') return;
    if (!d.ok) { feelStatus('⚠️ ' + d.error, 'err'); $('feelVis').title = 'Не записано: ' + d.error; return; }
    if ((val('swimDate') || todayStr()) !== w.date) return; // пока шёл ответ, дату сменили
    const at = d.actual != null ? { date: w.date, win: w.win, loc: w.loc } : null;
    const changed = feel.actual !== d.actual;
    feel = { actual: d.actual, at };
    $('feelVis').value = d.actual != null ? ru(d.actual) : '';
    feelStatus(d.actual != null ? WIN_RU[w.win] : '', w.kind === 'set' ? 'ok' : null);
    // в запись заплыва (если она есть), без автосохранения остального
    const h = getHistory(), r = h.find(x => x.date === w.date);
    if (r && !r.plan && (changed || JSON.stringify(r.feelAt || null) !== JSON.stringify(at))) { r.feelVis = d.actual; r.feelAt = at; setHistory(h); }
}
// Курорт для прозрачности задаёт заплыв: window.SWIM_CLARITY_LOC читается фреймом при загрузке.
let clarityHtml = null, clarityLocId = null;
function syncClarityLoc() {
    const r = resortById(val('locationSelect')) || BUILTIN_RESORTS[0];
    window.SWIM_CLARITY_LOC = { id: r.id, name: r.id === 'nhatrang' ? 'Нячанг, городской пляж' : r.name, lat: r.lat, lng: r.lng };
    const cached = lsGet(STORE_CLAR, null);
    if (cached && cached.locId !== r.id) { lsSet(STORE_CLAR, null); renderClarBadge(true); } // сохранено для другого места
    if (clarityHtml && clarityLocId !== r.id) {
        clarityLocId = r.id;
        clarReady = false;
        $('clarityFrame').srcdoc = clarityHtml;           // перезагрузка фрейма для нового места
        log('clarity-loc', { id: r.id });
    }
}
(function initClarity() {
    renderClarBadge(true);
    try {
        const bin = atob($('clarityB64').textContent.trim());
        clarityHtml = new TextDecoder('utf-8').decode(Uint8Array.from(bin, ch => ch.charCodeAt(0)));
    } catch (e) { log('clarity-load-error', { msg: String(e).slice(0, 200) }); }
    // открыт с #clarity или ссылкой синхронизации — сразу прозрачность, «Назад» вернёт на заплыв
    const base = location.pathname + location.search, h = location.hash;
    if (h === '#clarity' || h.startsWith('#sync=')) {
        try { history.replaceState(null, '', base); history.pushState({ clarity: 1 }, '', base + h); } catch (e) {}
        openClarityPage();
    }
})();

// закрытие/обновление страницы: несохранённые правки — сразу в запись, черновик — за датой
window.addEventListener('pagehide', () => { try { leaveDate(); } catch (e) {} });

// ================= СПЛИТТЕР =================
(function initSplitter() {
    const sp = $('splitter'), left = $('left');
    let drag = false;
    sp.addEventListener('mousedown', e => { drag = true; sp.classList.add('drag'); e.preventDefault(); });
    document.addEventListener('mousemove', e => {
        if (!drag) return;
        splitPx = Math.max(320, Math.min(window.innerWidth - 300, e.clientX));
        left.style.flex = `0 0 ${splitPx}px`;
        map.invalidateSize();
    });
    document.addEventListener('mouseup', () => { if (!drag) return; drag = false; sp.classList.remove('drag'); saveState(); drawTrack(); });
    sp.addEventListener('dblclick', () => { splitPx = null; left.style.flex = ''; map.invalidateSize(); saveState(); drawTrack(); });
})();

// ================= СТАРТ =================
// Сегодня есть запись — открыть её. Нет — черновик по последнему ФАКТУ (не по плану). Нет фактов — по прошлому состоянию.
(function init() {
    renderResortSelect();
    const today = todayStr();
    $('swimDate').value = today;
    const s = lsGet(STORE_STATE, null);
    if (s) {
        if (s.split) { splitPx = s.split; $('left').style.flex = `0 0 ${splitPx}px`; map.invalidateSize(); }
        showOsm = !!s.showOsm;
    }
    const hist = getHistory();
    const recToday = hist.find(r => r.date === today);
    const lastFact = hist.filter(r => !r.plan && r.date < today).sort((a, b) => b.date.localeCompare(a.date))[0];
    const fit = !(s && s.view);
    openDate = today;
    const draftToday = !recToday && getDrafts()[today];
    if (recToday) applyRecord(recToday, fit);
    else if (draftToday) applyRecord(draftToday, fit, true);
    else if (lastFact) applyRecord(lastFact, fit, true);
    else if (s) {
        restoring = true;
        if (s.location) $('locationSelect').value = s.location;
        if (s.depth) $('swimDepth').value = s.depth;
        $('ryskPct').value = s.rysk != null ? s.rysk : DEFAULT_RYSK;
        if (s.timeH != null) $('timeH').value = fmtH(s.timeH + (s.timeM || 0) / 60); // timeM — от старой версии
        if (s.weight) $('weight').value = s.weight;
        if (s.water) $('water').value = s.water;
        if (s.seaSide) seaSide = s.seaSide;
        if (s.startTime) $('startTime').value = s.startTime;
        if (s.endTime) $('endTime').value = s.endTime;
        setRoute(s.points, fit);
        restoring = false;
    }
    if (s && s.view) map.setView(s.view.c, s.view.z);
    log('open', { date: today, from: recToday ? 'today' : draftToday ? 'draft' : lastFact ? 'last-fact ' + lastFact.date : s ? 'state' : 'empty',
                  pts: points.length, hist: hist.length });
    renderResortSelect(); prevResort = val('locationSelect');
    updateSwimRoute();
    renderHistory();
    drawOsm();
    syncClarityLoc(); // грузит фрейм прозрачности с курортом заплыва
    feelRefresh();
})();
</script>
